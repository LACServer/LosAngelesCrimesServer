<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L.A. Crimes — Server Control</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: #fff;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(80,130,255,.28),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(180,70,255,.24),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(50,255,150,.12),
            transparent 38%
        ),
        #04050b;

    perspective: 1400px;
}


/* =========================================================
   3D BACKGROUND
========================================================= */

.scene {
    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -5;
}


/* Floating glass cubes */

.cube {
    position: absolute;

    width: 90px;
    height: 90px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.015)
        );

    backdrop-filter: blur(8px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 25px 60px rgba(0,0,0,.25);

    transform-style: preserve-3d;

    animation:
        cubeFloat
        var(--speed)
        ease-in-out
        infinite
        alternate;
}

.cube:nth-child(1) {
    left: 5%;
    top: 15%;

    --speed: 8s;

    transform:
        rotateX(35deg)
        rotateY(40deg)
        rotateZ(15deg);
}

.cube:nth-child(2) {
    right: 8%;
    top: 45%;

    width: 130px;
    height: 130px;

    --speed: 11s;

    transform:
        rotateX(50deg)
        rotateY(25deg)
        rotateZ(25deg);
}

.cube:nth-child(3) {
    left: 35%;
    bottom: -20px;

    width: 75px;
    height: 75px;

    --speed: 9s;

    transform:
        rotateX(25deg)
        rotateY(55deg)
        rotateZ(10deg);
}

@keyframes cubeFloat {

    from {
        translate: 0 0;
    }

    to {
        translate: 0 -45px;
    }
}


/* =========================================================
   GLOWING ORBS
========================================================= */

.orb {
    position: absolute;

    border-radius: 50%;

    filter: blur(70px);

    opacity: .3;

    animation:
        orbFloat 12s
        ease-in-out
        infinite
        alternate;
}

.orb.one {
    width: 350px;
    height: 350px;

    left: -150px;
    top: 25%;

    background:
        #2864ff;
}

.orb.two {
    width: 300px;
    height: 300px;

    right: -100px;
    bottom: 10%;

    background:
        #a62cff;

    animation-delay: -4s;
}

@keyframes orbFloat {

    from {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(30px,-50px,0)
            scale(1.18);
    }
}


/* =========================================================
   MAIN
========================================================= */

.container {

    width:
        min(
            1100px,
            calc(100% - 30px)
        );

    margin:
        35px auto
        70px;

    transform-style: preserve-3d;
}


/* =========================================================
   GLASS CARD
========================================================= */

.glass {

    position: relative;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:
        28px;

    backdrop-filter:
        blur(25px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(145%);

    box-shadow:
        0 35px 80px
        rgba(0,0,0,.42),

        0 10px 25px
        rgba(0,0,0,.25),

        inset 0 1px 0
        rgba(255,255,255,.14),

        inset 0 -1px 0
        rgba(255,255,255,.025);

    overflow: hidden;

    transform-style:
        preserve-3d;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}


/* Glass reflection */

.glass::before {

    content: "";

    position: absolute;

    top: -80%;

    left: -30%;

    width: 160%;
    height: 120%;

    background:
        linear-gradient(
            115deg,
            transparent 35%,
            rgba(255,255,255,.08) 50%,
            transparent 65%
        );

    transform:
        rotate(-8deg)
        translateZ(20px);

    pointer-events: none;
}


/* Edge highlight */

.glass::after {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    box-shadow:
        inset 0 0 35px
        rgba(255,255,255,.018);

    pointer-events: none;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    padding:
        38px;

    margin-bottom:
        20px;

    transform:
        perspective(1200px)
        rotateX(2deg)
        translateZ(10px);
}

.header:hover {

    transform:
        perspective(1200px)
        rotateX(0deg)
        translateY(-4px)
        translateZ(20px);

    box-shadow:
        0 45px 100px
        rgba(0,0,0,.5),

        inset 0 1px 0
        rgba(255,255,255,.18);
}

.logo {

    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 64px;
    height: 64px;

    margin-bottom: 18px;

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.17),
            rgba(255,255,255,.04)
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 12px 0 rgba(0,0,0,.18),
        0 20px 30px rgba(0,0,0,.28),
        inset 0 2px 0 rgba(255,255,255,.14);

    transform:
        perspective(500px)
        rotateX(8deg)
        rotateY(-8deg)
        translateZ(20px);

    font-size: 28px;
}

.header h1 {

    position: relative;

    margin:
        0 0 10px;

    font-size:
        clamp(
            28px,
            6vw,
            42px
        );

    line-height: 1;

    letter-spacing:
        -1.5px;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.3);
}

.header p {

    position: relative;

    margin: 0;

    color:
        rgba(255,255,255,.55);

    font-size: 15px;
}


/* =========================================================
   CONTROL PANEL
========================================================= */

.controls {

    padding:
        26px;

    margin-bottom:
        20px;

    transform:
        perspective(1200px)
        rotateX(1deg)
        translateZ(5px);
}

.controls:hover {

    transform:
        perspective(1200px)
        rotateX(0deg)
        translateY(-2px)
        translateZ(12px);
}

label {

    position: relative;

    display: block;

    margin-bottom: 9px;

    font-size: 13px;

    font-weight: 700;

    color:
        rgba(255,255,255,.65);
}

input {

    position: relative;

    width: 100%;

    height: 54px;

    padding:
        0 17px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:
        17px;

    outline: none;

    color: white;

    background:
        linear-gradient(
            145deg,
            rgba(0,0,0,.35),
            rgba(255,255,255,.025)
        );

    box-shadow:
        inset 0 6px 20px
        rgba(0,0,0,.22),

        inset 0 1px 0
        rgba(255,255,255,.05);

    transition:
        .2s ease;
}

input:focus {

    border-color:
        rgba(100,160,255,.65);

    box-shadow:
        0 0 0 4px
        rgba(90,140,255,.08),

        inset 0 6px 20px
        rgba(0,0,0,.25);
}

.small {

    margin-top:
        7px;

    color:
        rgba(255,255,255,.40);

    font-size:
        12px;
}


/* =========================================================
   BUTTON AREA
========================================================= */

.buttons {

    display: flex;

    gap: 18px;

    margin-top:
        22px;

    flex-wrap: wrap;

    perspective:
        1000px;
}


/* =========================================================
   FULL 3D BUTTON
========================================================= */

button {

    position: relative;

    min-width:
        175px;

    min-height:
        62px;

    padding:
        16px 27px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:
        19px;

    color: white;

    font-size:
        14px;

    font-weight:
        850;

    cursor:
        pointer;

    overflow:
        visible;

    transform-style:
        preserve-3d;

    transform:
        perspective(800px)
        rotateX(7deg)
        translateZ(0);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.17),
            rgba(255,255,255,.045)
        );

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:

        /* bottom extrusion */
        0 13px 0
        rgba(0,0,0,.32),

        /* large shadow */
        0 24px 35px
        rgba(0,0,0,.38),

        /* top edge */
        inset 0 2px 0
        rgba(255,255,255,.14),

        /* lower edge */
        inset 0 -4px 0
        rgba(0,0,0,.12);

    transition:
        transform .16s ease,
        box-shadow .16s ease,
        filter .16s ease;
}


/* 3D lower extrusion */

button::after {

    content: "";

    position: absolute;

    left: 2px;
    right: 2px;

    bottom:
        -13px;

    height:
        16px;

    border-radius:
        0 0 16px 16px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.30),
            rgba(0,0,0,.58)
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    transform:
        translateZ(-2px);

    pointer-events:
        none;
}


/* Button glass reflection */

button::before {

    content: "";

    position: absolute;

    left: 7%;

    top: 4px;

    width: 86%;

    height: 43%;

    border-radius:
        14px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.19),
            rgba(255,255,255,.015)
        );

    transform:
        translateZ(15px);

    pointer-events:
        none;
}


/* Text gets actual 3D depth */

button span {

    position: relative;

    z-index: 3;

    display: inline-block;

    transform:
        translateZ(20px);

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.35);
}


/* Hover */

button:hover:not(:disabled) {

    transform:
        perspective(800px)
        rotateX(2deg)
        translateY(-6px)
        translateZ(18px)
        scale(1.025);

    box-shadow:

        0 18px 0
        rgba(0,0,0,.32),

        0 32px 50px
        rgba(0,0,0,.46),

        inset 0 2px 0
        rgba(255,255,255,.18),

        inset 0 -4px 0
        rgba(0,0,0,.10);

    filter:
        brightness(1.12);
}


/* Physical press */

button:active:not(:disabled) {

    transform:
        perspective(800px)
        rotateX(-4deg)
        translateY(9px)
        translateZ(0)
        scale(.985);

    box-shadow:

        0 3px 0
        rgba(0,0,0,.35),

        0 8px 14px
        rgba(0,0,0,.25),

        inset 0 2px 0
        rgba(255,255,255,.08);
}


/* Disabled */

button:disabled {

    opacity:
        .32;

    cursor:
        not-allowed;

    transform:
        perspective(800px)
        rotateX(5deg);

    box-shadow:

        0 5px 0
        rgba(0,0,0,.20),

        0 10px 18px
        rgba(0,0,0,.18);
}


/* =========================================================
   START BUTTON
========================================================= */

.start {

    border-color:
        rgba(70,255,145,.32);

    background:
        linear-gradient(
            145deg,
            rgba(65,255,135,.30),
            rgba(15,115,60,.09)
        );

    box-shadow:

        0 13px 0
        rgba(8,75,38,.58),

        0 24px 35px
        rgba(0,0,0,.38),

        inset 0 2px 0
        rgba(255,255,255,.13),

        0 -4px 0
        rgba(0,0,0,.10);
}

.start:hover:not(:disabled) {

    background:
        linear-gradient(
            145deg,
            rgba(75,255,150,.42),
            rgba(20,140,70,.15)
        );

    box-shadow:

        0 18px 0
        rgba(8,75,38,.58),

        0 32px 50px
        rgba(0,0,0,.46),

        inset 0 2px 0
        rgba(255,255,255,.18);
}


/* =========================================================
   STOP BUTTON
========================================================= */

.stop {

    border-color:
        rgba(255,80,80,.32);

    background:
        linear-gradient(
            145deg,
            rgba(255,70,70,.30),
            rgba(120,20,20,.09)
        );

    box-shadow:

        0 13px 0
        rgba(80,12,12,.60),

        0 24px 35px
        rgba(0,0,0,.38),

        inset 0 2px 0
        rgba(255,255,255,.13),

        0 -4px 0
        rgba(0,0,0,.10);
}

.stop:hover:not(:disabled) {

    background:
        linear-gradient(
            145deg,
            rgba(255,80,80,.43),
            rgba(145,25,25,.16)
        );

    box-shadow:

        0 18px 0
        rgba(80,12,12,.60),

        0 32px 50px
        rgba(0,0,0,.46),

        inset 0 2px 0
        rgba(255,255,255,.18);
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display:
        flex;

    align-items:
        center;

    gap:
        15px;

    padding:
        21px 25px;

    margin-bottom:
        20px;

    transform:
        perspective(1200px)
        translateZ(8px);
}

.status:hover {

    transform:
        perspective(1200px)
        translateY(-3px)
        translateZ(18px);
}

.dot {

    width:
        14px;

    height:
        14px;

    flex-shrink:
        0;

    border-radius:
        50%;

    background:
        #666;

    box-shadow:
        none;

    transition:
        .3s ease;
}

.status-text {

    font-weight:
        850;

    font-size:
        15px;
}

.online {
    color:
        #67ff9c;
}

.error {
    color:
        #ff6666;
}

.warning {
    color:
        #ffd66b;
}


/* =========================================================
   SERVER CARD
========================================================= */

.server-card {

    display:
        none;

    padding:
        27px;

    margin-bottom:
        20px;

    transform:
        perspective(1200px)
        rotateX(-2deg)
        translateZ(15px);
}

.server-card.show {

    display:
        block;

    animation:
        cardAppear .5s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;

        transform:
            perspective(1200px)
            rotateX(-12deg)
            translateY(20px)
            translateZ(0);
    }

    to {
        opacity: 1;

        transform:
            perspective(1200px)
            rotateX(-2deg)
            translateY(0)
            translateZ(15px);
    }
}

.server-card:hover {

    transform:
        perspective(1200px)
        rotateX(0deg)
        translateY(-4px)
        translateZ(25px);
}

.server-address {

    margin-top:
        9px;

    font-size:
        clamp(
            21px,
            5vw,
            31px
        );

    font-weight:
        900;

    letter-spacing:
        -.7px;

    word-break:
        break-all;

    color:
        #7dffa9;

    text-shadow:
        0 0 25px
        rgba(80,255,150,.25);
}


/* =========================================================
   LOG
========================================================= */

.log-card {

    padding:
        26px;

    transform:
        perspective(1200px)
        rotateX(1deg)
        translateZ(5px);
}

.log-card:hover {

    transform:
        perspective(1200px)
        rotateX(0deg)
        translateY(-3px)
        translateZ(15px);
}

.log-title {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;
}

.log-title strong {

    font-size:
        15px;
}

.live-badge {

    padding:
        6px 10px;

    border-radius:
        999px;

    font-size:
        10px;

    font-weight:
        800;

    color:
        #7dffa9;

    background:
        rgba(70,255,145,.08);

    border:
        1px solid
        rgba(70,255,145,.18);
}

.log {

    height:
        500px;

    margin-top:
        16px;

    padding:
        18px;

    overflow-y:
        auto;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius:
        20px;

    background:
        linear-gradient(
            145deg,
            rgba(0,0,0,.48),
            rgba(255,255,255,.018)
        );

    box-shadow:

        inset 0 8px 30px
        rgba(0,0,0,.22),

        inset 0 1px 0
        rgba(255,255,255,.035);

    font-family:
        "Cascadia Code",
        Consolas,
        "Courier New",
        monospace;

    font-size:
        12px;

    line-height:
        1.6;

    color:
        rgba(255,255,255,.80);

    white-space:
        pre-wrap;

    word-break:
        break-word;
}

.log::-webkit-scrollbar {
    width:
        8px;
}

.log::-webkit-scrollbar-track {
    background:
        transparent;
}

.log::-webkit-scrollbar-thumb {

    border-radius:
        20px;

    background:
        rgba(255,255,255,.13);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    text-align:
        center;

    margin-top:
        20px;

    color:
        rgba(255,255,255,.30);

    font-size:
        11px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    .container {

        width:
            calc(100% - 18px);

        margin:
            12px auto 35px;
    }

    .header {

        padding:
            28px 23px;
    }

    .controls,
    .log-card,
    .server-card {

        padding:
            20px;
    }

    .buttons {

        gap:
            15px;
    }

    button {

        min-width:
            0;

        flex:
            1;
    }

    .log {

        height:
            420px;

        padding:
            13px;

        font-size:
            11px;
    }

    .cube {

        opacity:
            .35;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     3D BACKGROUND
===================================================== -->

<div class="scene">

    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="cube"></div>
    <div class="cube"></div>
    <div class="cube"></div>

</div>



<div class="container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <section class="glass header">

        <div class="logo">
            🎮
        </div>

        <h1>
            L.A. Crimes Server
        </h1>

        <p>
            GitHub Actions powered multiplayer server
        </p>

    </section>



    <!-- =================================================
         CONTROL PANEL
    ================================================== -->

    <section class="glass controls">

        <label for="token">
            GitHub Personal Access Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="github_pat_..."
            autocomplete="off"
        >

        <div class="small">
            Your token is only kept in this browser tab.
        </div>


        <div class="buttons">

            <button
                id="start"
                class="start"
                onclick="startServer()"
            >
                <span>
                    ▶ Start Server
                </span>
            </button>


            <button
                id="stop"
                class="stop"
                onclick="stopServer()"
                disabled
            >
                <span>
                    ■ Stop Server
                </span>
            </button>

        </div>

    </section>



    <!-- =================================================
         STATUS
    ================================================== -->

    <section class="glass status">

        <div
            id="dot"
            class="dot"
        ></div>


        <div>

            <div
                id="status"
                class="status-text"
            >
                Server offline
            </div>


            <div
                id="runInfo"
                class="small"
            >
                No workflow running
            </div>

        </div>

    </section>



    <!-- =================================================
         SERVER ADDRESS
    ================================================== -->

    <section
        id="serverCard"
        class="glass server-card"
    >

        <div class="small">
            PUBLIC SERVER ADDRESS
        </div>


        <div
            id="address"
            class="server-address"
        >
            Waiting...
        </div>


        <div class="small">
            L.A. Crimes · City · UDP
        </div>

    </section>



    <!-- =================================================
         LOG
    ================================================== -->

    <section class="glass log-card">

        <div class="log-title">

            <strong>
                Live Server Log
            </strong>

            <div class="live-badge">
                LIVE
            </div>

        </div>


        <div
            id="log"
            class="log"
        >Waiting for server...</div>

    </section>


    <div class="footer">
        L.A. Crimes Server Control · GitHub Actions
    </div>

</div>



<script>

/* =========================================================
   GITHUB CONFIG
========================================================= */

const OWNER =
    "LACServer";

const REPO =
    "LosAngelesCrimesServer";

const WORKFLOW_FILE =
    "main.yml";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";


/* =========================================================
   SERVER STATE
========================================================= */

let workflowRunId =
    null;

let jobId =
    null;

let polling =
    null;

let serverOnline =
    false;


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    const token =
        document
            .getElementById("token")
            .value
            .trim();


    if (!token) {

        throw new Error(
            "Please enter your GitHub token."
        );
    }


    return token;
}


/* =========================================================
   GITHUB API
========================================================= */

async function github(
    path,
    options = {}
) {

    const token =
        getToken();


    let response;


    try {

        response =
            await fetch(
                API + path,
                {
                    ...options,

                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            "Bearer " + token,

                        "X-GitHub-Api-Version":
                            API_VERSION,

                        ...(options.headers || {})
                    }
                }
            );

    }

    catch (error) {

        throw new Error(
            "Failed to connect to GitHub API."
        );
    }


    if (!response.ok) {

        let message =
            response.statusText;


        try {

            const data =
                await response.json();


            if (data.message) {

                message =
                    data.message;
            }

        }

        catch (_) {}


        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (
        response.status ===
        204
    ) {

        return null;
    }


    return response.json();
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
) {

    const status =
        document
            .getElementById("status");

    const dot =
        document
            .getElementById("dot");


    status.textContent =
        text;

    status.className =
        "status-text " + type;


    if (type === "online") {

        dot.style.background =
            "#67ff9c";

        dot.style.boxShadow =
            "0 0 20px #67ff9c";

    }

    else if (type === "error") {

        dot.style.background =
            "#ff6666";

        dot.style.boxShadow =
            "0 0 20px #ff6666";

    }

    else if (type === "warning") {

        dot.style.background =
            "#ffd66b";

        dot.style.boxShadow =
            "0 0 20px #ffd66b";

    }

    else {

        dot.style.background =
            "#666";

        dot.style.boxShadow =
            "none";
    }
}


/* =========================================================
   LOG
========================================================= */

function setLog(text) {

    const log =
        document
            .getElementById("log");


    log.textContent =
        text ||
        "Waiting for log...";


    log.scrollTop =
        log.scrollHeight;
}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   START SERVER
========================================================= */

async function startServer() {

    try {

        serverOnline =
            false;


        document
            .getElementById("start")
            .disabled = true;


        document
            .getElementById("stop")
            .disabled = true;


        document
            .getElementById("serverCard")
            .classList.remove("show");


        setStatus(
            "Starting workflow...",
            "warning"
        );


        setLog(
`======================================
STARTING L.A. CRIMES SERVER
======================================

Sending workflow request...`
        );


        const startTime =
            Date.now();


        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        ref:
                            "main"
                    })
            }
        );


        setLog(
`======================================
WORKFLOW STARTED
======================================

GitHub accepted the request.

Finding the new workflow run...`
        );


        workflowRunId =
            await findNewRun(
                startTime
            );


        if (!workflowRunId) {

            throw new Error(
                "Workflow started but its run could not be found."
            );
        }


        document
            .getElementById("runInfo")
            .textContent =
            "Run ID: " +
            workflowRunId;


        setStatus(
            "Preparing server...",
            "warning"
        );


        setLog(
`======================================
WORKFLOW RUN FOUND
======================================

Run ID: ${workflowRunId}

Waiting for server job...`
        );


        startPolling();

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Failed to start server",
            "error"
        );


        setLog(
`======================================
ERROR
======================================

${error.message}`
        );


        document
            .getElementById("start")
            .disabled = false;


        document
            .getElementById("stop")
            .disabled = true;
    }
}


/* =========================================================
   FIND NEW WORKFLOW RUN
========================================================= */

async function findNewRun(
    startTime
) {

    for (
        let attempt = 0;
        attempt < 30;
        attempt++
    ) {

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=10`
            );


        const runs =
            data.workflow_runs ||
            [];


        const run =
            runs.find(
                item => {

                    const created =
                        new Date(
                            item.created_at
                        ).getTime();


                    return (
                        created >=
                        startTime - 15000
                    );
                }
            );


        if (run) {

            return run.id;
        }


        await sleep(
            2000
        );
    }


    return null;
}


/* =========================================================
   POLLING
========================================================= */

function startPolling() {

    if (polling) {

        clearInterval(
            polling
        );
    }


    pollServer();


    /*
        Check every 10 seconds.
    */

    polling =
        setInterval(
            pollServer,
            10000
        );
}


/* =========================================================
   POLL SERVER
========================================================= */

async function pollServer() {

    if (!workflowRunId) {

        return;
    }


    try {

        const run =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}`
            );


        document
            .getElementById("runInfo")
            .textContent =
            `Run ${workflowRunId} · ${run.status}`;


        /*
            Workflow finished.
        */

        if (
            run.status ===
            "completed"
        ) {

            serverOnline =
                false;


            clearInterval(
                polling
            );


            if (
                run.conclusion ===
                "success"
            ) {

                setStatus(
                    "Server stopped",
                    ""
                );

            }

            else {

                setStatus(
                    "Server stopped",
                    ""
                );
            }


            document
                .getElementById("start")
                .disabled = false;


            document
                .getElementById("stop")
                .disabled = true;


            return;
        }


        /*
            Get workflow jobs.
        */

        const jobs =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/jobs?per_page=100`
            );


        const list =
            jobs.jobs ||
            [];


        const serverJob =
            list.find(
                job =>
                    job.name ===
                    "server"
            ) ||
            list.find(
                job =>
                    job.name
                        .toLowerCase()
                        .includes(
                            "server"
                        )
            );


        if (!serverJob) {

            if (!serverOnline) {

                setStatus(
                    "Waiting for server job...",
                    "warning"
                );
            }

            return;
        }


        jobId =
            serverJob.id;


        await getJobLog(
            jobId
        );


        /*
            NEVER disable Stop while
            the workflow is still running
            if the server has already been
            detected.
        */

        if (serverOnline) {

            document
                .getElementById("stop")
                .disabled = false;

            document
                .getElementById("start")
                .disabled = true;

            setStatus(
                "🟢 Server is ONLINE",
                "online"
            );
        }

    }

    catch (error) {

        console.error(
            "Polling error:",
            error
        );
    }
}


/* =========================================================
   GET JOB LOG
========================================================= */

async function getJobLog(
    id
) {

    const token =
        getToken();


    let response;


    try {

        response =
            await fetch(
                `${API}/repos/${OWNER}/${REPO}/actions/jobs/${id}/logs`,
                {
                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            "Bearer " + token,

                        "X-GitHub-Api-Version":
                            API_VERSION
                    }
                }
            );

    }

    catch (_) {

        return;
    }


    if (!response.ok) {

        return;
    }


    const text =
        await response.text();


    if (!text.trim()) {

        return;
    }


    setLog(
        text
    );


    parseServerLog(
        text
    );
}


/* =========================================================
   DETECT SERVER READY
========================================================= */

function parseServerLog(
    text
) {

    /*
        Expected YAML marker:

        SERVER_READY=true
    */

    if (
        /SERVER_READY\s*=\s*true/i
            .test(text)
    ) {

        serverOnline =
            true;


        setStatus(
            "🟢 Server is ONLINE",
            "online"
        );


        document
            .getElementById("start")
            .disabled = true;


        document
            .getElementById("stop")
            .disabled = false;
    }


    /*
        Expected YAML marker:

        PUBLIC_ENDPOINT=nl.portbuddy.tech:40083
    */

    const endpoint =
        text.match(
            /PUBLIC_ENDPOINT\s*=\s*(\S+)/i
        );


    if (endpoint) {

        const address =
            endpoint[1];


        document
            .getElementById("address")
            .textContent =
            address;


        document
            .getElementById("serverCard")
            .classList.add(
                "show"
            );


        serverOnline =
            true;


        document
            .getElementById("start")
            .disabled = true;


        document
            .getElementById("stop")
            .disabled = false;


        setStatus(
            "🟢 Server is ONLINE",
            "online"
        );
    }
}


/* =========================================================
   STOP SERVER
========================================================= */

async function stopServer() {

    if (!workflowRunId) {

        setStatus(
            "No active server",
            "warning"
        );

        return;
    }


    if (
        !confirm(
            "Stop the L.A. Crimes server?"
        )
    ) {

        return;
    }


    try {

        document
            .getElementById("stop")
            .disabled = true;


        setStatus(
            "Stopping server...",
            "warning"
        );


        setLog(
            document
                .getElementById("log")
                .textContent +

`\n
======================================
STOP REQUEST SENT
======================================

GitHub is stopping the workflow...`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/cancel`,
            {
                method:
                    "POST"
            }
        );


        serverOnline =
            false;

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Failed to stop server",
            "error"
        );


        setLog(
            document
                .getElementById("log")
                .textContent +

`\n\n
STOP ERROR:

${error.message}`
        );


        document
            .getElementById("stop")
            .disabled = false;
    }
}


/* =========================================================
   ENTER TO START
========================================================= */

document
    .getElementById("token")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                startServer();
            }
        }
    );

</script>
