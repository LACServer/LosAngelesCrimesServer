<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L.A. Crimes Server</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top left, rgba(80, 120, 255, .25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(180, 60, 255, .20), transparent 35%),
        #070914;
}

.container {
    width: min(1100px, calc(100% - 30px));
    margin: 40px auto;
}

.glass {
    background: rgba(255, 255, 255, .075);
    border: 1px solid rgba(255, 255, 255, .13);
    box-shadow:
        0 20px 60px rgba(0, 0, 0, .35),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-radius: 24px;
}

.header {
    padding: 28px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 32px;
}

.header p {
    margin: 0;
    opacity: .65;
}

.controls {
    padding: 22px;
    display: grid;
    gap: 14px;
    margin-bottom: 18px;
}

label {
    font-size: 13px;
    opacity: .7;
}

input {
    width: 100%;
    padding: 14px 16px;

    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.12);

    background: rgba(0,0,0,.25);
    color: white;

    outline: none;
}

input:focus {
    border-color: rgba(120,160,255,.7);
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: 0;
    padding: 13px 20px;
    border-radius: 14px;

    color: white;
    font-weight: bold;

    cursor: pointer;

    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.12);

    transition: .15s;
}

button:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,.18);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

.start {
    background: rgba(70, 190, 110, .25);
}

.stop {
    background: rgba(220, 70, 70, .25);
}

.status {
    padding: 18px 22px;
    margin-bottom: 18px;

    display: flex;
    align-items: center;
    gap: 12px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #777;
    box-shadow: 0 0 12px currentColor;
}

.status-text {
    font-weight: bold;
}

.server-card {
    padding: 22px;
    margin-bottom: 18px;

    display: none;
}

.server-card.visible {
    display: block;
}

.server-address {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;

    word-break: break-all;
}

.map {
    opacity: .65;
    margin-top: 8px;
}

.log-card {
    padding: 22px;
}

.log {
    margin-top: 14px;

    height: 500px;
    overflow: auto;

    padding: 18px;

    border-radius: 16px;

    background: rgba(0,0,0,.42);

    color: #d9e2ff;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;

    line-height: 1.5;

    white-space: pre-wrap;
    word-break: break-word;
}

.small {
    opacity: .5;
    font-size: 12px;
}

.error {
    color: #ff8585;
}

.ready {
    color: #73ff9a;
}

.warning {
    color: #ffd36b;
}

@media(max-width:700px) {
    .container {
        width: calc(100% - 18px);
        margin: 15px auto;
    }

    .header h1 {
        font-size: 25px;
    }

    .log {
        height: 400px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="glass header">
        <h1>🎮 L.A. Crimes Server</h1>
        <p>GitHub Actions powered public server</p>
    </div>

    <div class="glass controls">

        <div>
            <label>GitHub Personal Access Token</label>

            <input
                id="token"
                type="password"
                autocomplete="off"
                placeholder="github_pat_..."
            >

            <div class="small">
                Your token stays in this browser tab and is never saved by this page.
            </div>
        </div>

        <div class="buttons">

            <button
                id="startButton"
                class="start"
                onclick="startServer()"
            >
                ▶ Start Server
            </button>

            <button
                id="stopButton"
                class="stop"
                onclick="stopServer()"
                disabled
            >
                ■ Stop Server
            </button>

        </div>

    </div>

    <div class="glass status">

        <div id="statusDot" class="dot"></div>

        <div>
            <div id="statusText" class="status-text">
                Server offline
            </div>

            <div id="runText" class="small">
                No workflow running
            </div>
        </div>

    </div>

    <div id="serverCard" class="glass server-card">

        <div class="small">
            PUBLIC SERVER
        </div>

        <div id="serverAddress" class="server-address">
            Waiting...
        </div>

        <div class="map">
            Map: City · UDP 7777
        </div>

    </div>

    <div class="glass log-card">

        <div>
            <strong>Live Server Log</strong>
        </div>

        <div id="log" class="log">
Waiting for server...
        </div>

    </div>

</div>

<script>

/*
==========================================================
CONFIGURATION
==========================================================
*/

const OWNER = "LACServer";
const REPO = "LosAngelesCrimesServer";

/*
IMPORTANT:
Change this if your workflow filename is different.

Example:
.github/workflows/server.yml
*/

const WORKFLOW_FILE = "server.yml";

const API = "https://api.github.com";

const API_VERSION = "2026-03-10";

let currentRunId = null;
let currentJobId = null;

let pollTimer = null;

let starting = false;


/*
==========================================================
GITHUB REQUEST
==========================================================
*/

async function github(path, options = {}) {

    const token =
        document.getElementById("token").value.trim();

    if (!token) {
        throw new Error("GitHub token is missing.");
    }

    const headers = {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${token}`,
        "X-GitHub-Api-Version": API_VERSION
    };

    const response = await fetch(
        API + path,
        {
            ...options,
            headers: {
                ...headers,
                ...(options.headers || {})
            }
        }
    );

    if (!response.ok) {

        let message = "";

        try {
            const data = await response.json();

            message =
                data.message ||
                JSON.stringify(data);

        } catch {
            message = await response.text();
        }

        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }

    if (response.status === 204) {
        return null;
    }

    return response.json();
}


/*
==========================================================
UI HELPERS
==========================================================
*/

function setStatus(text, type = "normal") {

    const statusText =
        document.getElementById("statusText");

    const dot =
        document.getElementById("statusDot");

    statusText.textContent = text;

    statusText.className = "status-text";

    dot.style.color = "#777";
    dot.style.background = "#777";

    if (type === "ready") {

        statusText.classList.add("ready");

        dot.style.color = "#73ff9a";
        dot.style.background = "#73ff9a";

    }

    if (type === "warning") {

        statusText.classList.add("warning");

        dot.style.color = "#ffd36b";
        dot.style.background = "#ffd36b";

    }

    if (type === "error") {

        statusText.classList.add("error");

        dot.style.color = "#ff8585";
        dot.style.background = "#ff8585";
    }
}


function setLog(text) {

    const log =
        document.getElementById("log");

    log.textContent = text;

    log.scrollTop = log.scrollHeight;
}


function appendLog(text) {

    const log =
        document.getElementById("log");

    log.textContent +=
        (log.textContent ? "\n" : "") +
        text;

    log.scrollTop = log.scrollHeight;
}


function setButtons(startDisabled, stopDisabled) {

    document.getElementById("startButton")
        .disabled = startDisabled;

    document.getElementById("stopButton")
        .disabled = stopDisabled;
}


/*
==========================================================
START SERVER
==========================================================
*/

async function startServer() {

    if (starting) return;

    starting = true;

    setButtons(true, false);

    document
        .getElementById("serverCard")
        .classList.remove("visible");

    setStatus(
        "Starting GitHub Actions server...",
        "warning"
    );

    setLog("Starting workflow...\n");

    try {

        /*
        Record the exact time BEFORE dispatch.
        We then search for the workflow run created
        after this timestamp.
        */

        const startedAt =
            new Date().toISOString();

        /*
        Dispatch workflow.
        */

        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
            {
                method: "POST",
                body: JSON.stringify({
                    ref: "main"
                })
            }
        );

        appendLog(
            "✓ Workflow dispatch accepted."
        );

        appendLog(
            "Waiting for GitHub to create the workflow run..."
        );

        /*
        Find the newly-created run.
        */

        currentRunId =
            await findNewRun(startedAt);

        if (!currentRunId) {

            throw new Error(
                "GitHub created the workflow, but the new run could not be found."
            );
        }

        document
            .getElementById("runText")
            .textContent =
            `Workflow run: ${currentRunId}`;

        appendLog(
            `✓ Workflow run found: ${currentRunId}`
        );

        setStatus(
            "Workflow started",
            "warning"
        );

        /*
        Start polling.
        */

        await pollRun();

        clearInterval(pollTimer);

        pollTimer =
            setInterval(
                pollRun,
                10000
            );

    } catch (error) {

        console.error(error);

        setStatus(
            "Failed to start server",
            "error"
        );

        appendLog(
            "\nERROR:\n" +
            error.message
        );

        setButtons(false, true);

    } finally {

        starting = false;
    }
}


/*
==========================================================
FIND NEW WORKFLOW RUN
==========================================================
*/

async function findNewRun(startedAt) {

    const startTime =
        new Date(startedAt).getTime();

    for (let attempt = 0; attempt < 12; attempt++) {

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=10`
            );

        const runs =
            data.workflow_runs || [];

        const matching =
            runs
                .filter(run => {

                    const created =
                        new Date(
                            run.created_at
                        ).getTime();

                    return created >= startTime - 5000;
                })
                .sort(
                    (a, b) =>
                        new Date(b.created_at) -
                        new Date(a.created_at)
                );

        if (matching.length > 0) {

            return matching[0].id;
        }

        await sleep(2000);
    }

    return null;
}


/*
==========================================================
POLL WORKFLOW
==========================================================
*/

async function pollRun() {

    if (!currentRunId) return;

    try {

        const run =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${currentRunId}`
            );

        document
            .getElementById("runText")
            .textContent =
            `Run ${currentRunId} · ${run.status}`;

        /*
        Find server job.
        */

        const jobs =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${currentRunId}/jobs?per_page=100`
            );

        const serverJob =
            (jobs.jobs || []).find(
                job =>
                    job.name === "server" ||
                    job.name.includes("server")
            );

        if (serverJob) {

            currentJobId =
                serverJob.id;

            await getJobLog(currentJobId);
        }

        /*
        Detect server state.
        */

        if (run.status === "completed") {

            clearInterval(pollTimer);

            if (run.conclusion === "success") {

                setStatus(
                    "Workflow completed",
                    "ready"
                );

            } else {

                setStatus(
                    `Workflow ${run.conclusion || "failed"}`,
                    "error"
                );

                setButtons(false, true);
            }

            return;
        }

        /*
        If log contains SERVER_READY=true,
        the actual game server is ready even though
        the workflow itself is still running.
        */

    } catch (error) {

        console.error(error);

        appendLog(
            "\n[Dashboard error] " +
            error.message
        );
    }
}


/*
==========================================================
GET JOB LOG
==========================================================
*/

async function getJobLog(jobId) {

    const token =
        document.getElementById("token")
            .value
            .trim();

    if (!token) return;

    const response =
        await fetch(
            `${API}/repos/${OWNER}/${REPO}/actions/jobs/${jobId}/logs`,
            {
                headers: {
                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        `Bearer ${token}`,

                    "X-GitHub-Api-Version":
                        API_VERSION
                }
            }
        );

    /*
    GitHub can return 200 directly after following
    the temporary redirect, or a redirect depending
    on the browser/API behavior.
    */

    if (!response.ok) {

        if (response.status === 404) {

            setLog(
                "Job log is not available yet..."
            );

            return;
        }

        throw new Error(
            `Job log request failed: ${response.status}`
        );
    }

    const text =
        await response.text();

    if (!text.trim()) return;

    setLog(text);

    parseServerInfo(text);
}


/*
==========================================================
PARSE SERVER INFO
==========================================================
*/

function parseServerInfo(text) {

    /*
    We intentionally use explicit markers printed
    by the workflow.
    */

    const readyMatch =
        text.match(
            /SERVER_READY\s*=\s*true/i
        );

    const endpointMatch =
        text.match(
            /PUBLIC_ENDPOINT\s*=\s*(\S+)/i
        );

    if (readyMatch) {

        setStatus(
            "🟢 Server is ONLINE",
            "ready"
        );

        setButtons(true, false);
    }

    if (endpointMatch) {

        const endpoint =
            endpointMatch[1];

        const card =
            document.getElementById(
                "serverCard"
            );

        const address =
            document.getElementById(
                "serverAddress"
            );

        address.textContent =
            endpoint;

        card.classList.add(
            "visible"
        );
    }
}


/*
==========================================================
STOP SERVER
==========================================================
*/

async function stopServer() {

    if (!currentRunId) {

        setStatus(
            "No active workflow",
            "warning"
        );

        return;
    }

    const confirmed =
        confirm(
            "Stop the L.A. Crimes server?"
        );

    if (!confirmed) return;

    try {

        setStatus(
            "Stopping server...",
            "warning"
        );

        setButtons(true, true);

        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${currentRunId}/cancel`,
            {
                method: "POST"
            }
        );

        appendLog(
            "\n✓ Stop request sent to GitHub."
        );

        /*
        Keep polling until GitHub reports
        that the workflow has actually stopped.
        */

        pollTimer =
            setInterval(
                pollRun,
                10000
            );

    } catch (error) {

        console.error(error);

        setStatus(
            "Failed to stop server",
            "error"
        );

        appendLog(
            "\nSTOP ERROR:\n" +
            error.message
        );

        setButtons(true, false);
    }
}


/*
==========================================================
SLEEP
==========================================================
*/

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/*
==========================================================
INITIAL STATE
==========================================================
*/

setButtons(false, true);

</script>

</body>
    </html>
