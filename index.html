<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L.A. Crimes Server</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, Arial, sans-serif;
    color: #343447;

    background:
        linear-gradient(135deg, #ffdce8, #dceeff, #e5dcff);

    padding: 25px;
}

.container {
    width: min(900px, 100%);
    margin: auto;
}

.card {
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 18px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 40px rgba(70,70,110,.12),
        inset 0 1px rgba(255,255,255,.8);
}

h1 {
    margin: 0 0 8px;
    font-size: 32px;
}

.subtitle {
    color: #77778c;
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 48px;
    border: 1px solid rgba(120,120,160,.2);
    border-radius: 14px;
    padding: 0 15px;

    background: rgba(255,255,255,.65);
    color: #333;

    outline: none;
}

input:focus {
    border-color: #9c8cff;
    box-shadow: 0 0 0 3px rgba(156,140,255,.15);
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 18px;
}

button {
    border: 0;
    border-radius: 15px;
    padding: 14px 22px;

    font-weight: 800;
    font-size: 14px;

    cursor: pointer;

    transition:
        transform .15s,
        opacity .15s,
        box-shadow .15s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
}

button:active:not(:disabled) {
    transform: translateY(1px);
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.start {
    background: #b9f3d0;
    color: #24583b;
    box-shadow: 0 7px 0 #8ed5aa;
}

.stop {
    background: #ffc4ce;
    color: #71323d;
    box-shadow: 0 7px 0 #e99aa8;
}

.status {
    display: flex;
    align-items: center;
    gap: 12px;
}

.dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #aaa;
}

.dot.online {
    background: #55d98a;
    box-shadow: 0 0 15px rgba(85,217,138,.7);
}

.dot.warning {
    background: #f1c75b;
}

.dot.error {
    background: #ed687b;
}

.status-title {
    font-weight: 850;
}

.small {
    color: #77778c;
    font-size: 12px;
    margin-top: 4px;
}

.server {
    display: none;
}

.server.show {
    display: block;
}

.address {
    margin-top: 8px;
    padding: 15px;

    border-radius: 15px;

    background: rgba(255,255,255,.55);

    font-family: monospace;
    font-size: 20px;
    font-weight: 800;

    color: #4f6bc4;

    word-break: break-all;
}

.log {
    height: 430px;
    overflow: auto;

    margin-top: 12px;
    padding: 16px;

    border-radius: 16px;

    background: rgba(35,35,55,.88);
    color: #e9e9f5;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 12px;
    line-height: 1.55;

    white-space: pre-wrap;
    word-break: break-word;
}

.log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.badge {
    background: #d9cdfc;
    color: #57469b;

    border-radius: 999px;
    padding: 5px 10px;

    font-size: 11px;
    font-weight: 800;
}

.footer {
    text-align: center;
    color: rgba(50,50,70,.5);
    font-size: 11px;
    margin-top: 25px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h1>🎮 L.A. Crimes Server</h1>

        <div class="subtitle">
            GitHub Actions server control panel
        </div>
    </div>


    <div class="card">

        <label for="token">
            GitHub Personal Access Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="github_pat_..."
            autocomplete="off"
        >

        <div class="small">
            The token stays in this browser session.
        </div>

        <div class="buttons">

            <button
                id="start"
                class="start"
                onclick="startServer()"
            >
                ▶ Start Server
            </button>

            <button
                id="stop"
                class="stop"
                onclick="stopServer()"
                disabled
            >
                ■ Stop Server
            </button>

        </div>

    </div>


    <div class="card status">

        <div
            id="dot"
            class="dot"
        ></div>

        <div>

            <div
                id="status"
                class="status-title"
            >
                Checking server...
            </div>

            <div
                id="runInfo"
                class="small"
            >
                Looking for active workflow
            </div>

        </div>

    </div>


    <div
        id="serverCard"
        class="card server"
    >

        <strong>
            🌐 Public Server
        </strong>

        <div
            id="address"
            class="address"
        >
            Waiting...
        </div>

        <div class="small">
            Map: City · UDP
        </div>

    </div>


    <div class="card">

        <div class="log-header">

            <strong>
                Server Log
            </strong>

            <span class="badge">
                LIVE
            </span>

        </div>

        <div
            id="log"
            class="log"
        >Enter your GitHub token to connect.</div>

    </div>


    <div class="footer">
        L.A. Crimes Server Control
    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const OWNER =
    "LACServer";

const REPO =
    "LosAngelesCrimesServer";

const WORKFLOW =
    "main.yml";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";


/* =========================================================
   STATE
========================================================= */

let workflowRunId =
    sessionStorage.getItem(
        "lac_workflow_run"
    );

let jobId =
    sessionStorage.getItem(
        "lac_job_id"
    );

let pollTimer =
    null;

let serverOnline =
    false;


/* =========================================================
   ELEMENTS
========================================================= */

const tokenInput =
    document.getElementById(
        "token"
    );

const startButton =
    document.getElementById(
        "start"
    );

const stopButton =
    document.getElementById(
        "stop"
    );

const statusText =
    document.getElementById(
        "status"
    );

const runInfo =
    document.getElementById(
        "runInfo"
    );

const dot =
    document.getElementById(
        "dot"
    );

const logElement =
    document.getElementById(
        "log"
    );

const serverCard =
    document.getElementById(
        "serverCard"
    );

const addressElement =
    document.getElementById(
        "address"
    );


/* =========================================================
   SESSION TOKEN
========================================================= */

const savedToken =
    sessionStorage.getItem(
        "lac_github_token"
    );

if (savedToken) {

    tokenInput.value =
        savedToken;
}


tokenInput.addEventListener(
    "input",
    () => {

        const value =
            tokenInput.value.trim();

        if (value) {

            sessionStorage.setItem(
                "lac_github_token",
                value
            );

        } else {

            sessionStorage.removeItem(
                "lac_github_token"
            );
        }
    }
);


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    const token =
        tokenInput.value.trim();

    if (!token) {

        throw new Error(
            "Enter your GitHub token first."
        );
    }

    return token;
}


/* =========================================================
   GITHUB REQUEST
========================================================= */

async function github(
    path,
    options = {}
) {

    const token =
        getToken();

    const response =
        await fetch(
            API + path,
            {
                ...options,

                headers: {

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + token,

                    "X-GitHub-Api-Version":
                        API_VERSION,

                    ...(options.headers || {})
                }
            }
        );


    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.message) {
                message =
                    data.message;
            }

        } catch (_) {}

        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (
        response.status ===
        204
    ) {
        return null;
    }


    return response.json();
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
) {

    statusText.textContent =
        text;

    dot.className =
        "dot " + type;
}


/* =========================================================
   LOG
========================================================= */

function setLog(text) {

    logElement.textContent =
        text || "No log available.";

    logElement.scrollTop =
        logElement.scrollHeight;
}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   START
========================================================= */

async function startServer() {

    try {

        startButton.disabled =
            true;

        stopButton.disabled =
            true;

        serverOnline =
            false;

        setStatus(
            "Starting server...",
            "warning"
        );

        setLog(
`======================================
STARTING L.A. CRIMES
======================================

Sending workflow request...`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
            {
                method: "POST",

                body: JSON.stringify({
                    ref: "main"
                })
            }
        );


        setLog(
`======================================
WORKFLOW STARTED
======================================

GitHub accepted the request.

Finding the new workflow run...`
        );


        const run =
            await waitForNewRun();


        if (!run) {

            throw new Error(
                "Could not find the new workflow run."
            );
        }


        workflowRunId =
            run.id;

        sessionStorage.setItem(
            "lac_workflow_run",
            workflowRunId
        );


        runInfo.textContent =
            `Run ${workflowRunId} · ${run.status}`;


        beginPolling();

    }

    catch (error) {

        console.error(
            error
        );

        setStatus(
            "Failed to start",
            "error"
        );

        setLog(
`ERROR:

${error.message}`
        );

        startButton.disabled =
            false;

        stopButton.disabled =
            true;
    }
}


/* =========================================================
   FIND NEW RUN
========================================================= */

async function waitForNewRun() {

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=10`
            );


        const run =
            data.workflow_runs
                ?.find(
                    r =>
                        r.status ===
                            "queued" ||
                        r.status ===
                            "in_progress"
                );


        if (run) {

            return run;
        }


        await sleep(
            2000
        );
    }


    return null;
}


/* =========================================================
   PAGE LOAD RECOVERY
========================================================= */

async function recoverServer() {

    try {

        /*
         * If we already know the run ID,
         * check that first.
         */

        if (workflowRunId) {

            try {

                const run =
                    await github(
                        `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}`
                    );


                if (
                    run.status !==
                    "completed"
                ) {

                    setStatus(
                        "Reconnecting to server...",
                        "warning"
                    );

                    runInfo.textContent =
                        `Run ${run.id} · ${run.status}`;

                    beginPolling();

                    return;
                }

            }

            catch (_) {

                /*
                 * Stored run disappeared.
                 * Search GitHub again.
                 */

                sessionStorage.removeItem(
                    "lac_workflow_run"
                );

                workflowRunId =
                    null;
            }
        }


        /*
         * Search for ANY currently active
         * workflow.
         */

        const active =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?status=in_progress&per_page=10`
            );


        let run =
            active.workflow_runs
                ?.find(
                    r =>
                        r.event ===
                        "workflow_dispatch"
                );


        /*
         * Also check queued workflows.
         */

        if (!run) {

            const queued =
                await github(
                    `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?status=queued&per_page=10`
                );

            run =
                queued.workflow_runs
                    ?.find(
                        r =>
                            r.event ===
                            "workflow_dispatch"
                    );
        }


        if (run) {

            workflowRunId =
                run.id;

            sessionStorage.setItem(
                "lac_workflow_run",
                run.id
            );


            runInfo.textContent =
                `Run ${run.id} · ${run.status}`;


            setStatus(
                "Existing server found",
                "warning"
            );


            beginPolling();

            return;
        }


        /*
         * Nothing running.
         */

        setStatus(
            "Server offline"
        );

        runInfo.textContent =
            "No active workflow";


        startButton.disabled =
            false;

        stopButton.disabled =
            true;

    }

    catch (error) {

        console.error(
            error
        );

        setStatus(
            "GitHub connection error",
            "error"
        );

        runInfo.textContent =
            error.message;

        startButton.disabled =
            false;

        stopButton.disabled =
            true;
    }
}


/* =========================================================
   POLLING
========================================================= */

function beginPolling() {

    if (pollTimer) {

        clearInterval(
            pollTimer
        );
    }


    pollServer();


    pollTimer =
        setInterval(
            pollServer,
            10000
        );
}


/* =========================================================
   POLL
========================================================= */

async function pollServer() {

    if (!workflowRunId) {
        return;
    }


    try {

        const run =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}`
            );


        runInfo.textContent =
            `Run ${run.id} · ${run.status}`;


        /*
         * Workflow ended.
         */

        if (
            run.status ===
            "completed"
        ) {

            serverOnline =
                false;


            if (pollTimer) {

                clearInterval(
                    pollTimer
                );

                pollTimer =
                    null;
            }


            sessionStorage.removeItem(
                "lac_workflow_run"
            );

            sessionStorage.removeItem(
                "lac_job_id"
            );


            workflowRunId =
                null;

            jobId =
                null;


            setStatus(
                "Server offline"
            );


            startButton.disabled =
                false;

            stopButton.disabled =
                true;


            await loadFinalLogs(
                run
            );


            return;
        }


        /*
         * Workflow is alive.
         */

        setStatus(
            run.status ===
                "queued"
                ? "Server queued..."
                : "Server preparing...",
            "warning"
        );


        startButton.disabled =
            true;


        /*
         * Find server job.
         */

        const jobs =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/jobs?per_page=100`
            );


        const serverJob =
            jobs.jobs?.find(
                j =>
                    j.name ===
                    "server"
            );


        if (!serverJob) {

            return;
        }


        jobId =
            serverJob.id;


        sessionStorage.setItem(
            "lac_job_id",
            jobId
        );


        runInfo.textContent =
            `Run ${workflowRunId} · Job ${jobId} · ${serverJob.status}`;


        /*
         * Try to retrieve available logs.
         */

        await loadJobLog(
            jobId
        );


    }

    catch (error) {

        console.error(
            "Poll error:",
            error
        );
    }
}


/* =========================================================
   LOAD JOB LOG
========================================================= */

async function loadJobLog(
    id
) {

    const token =
        getToken();


    try {

        /*
         * GitHub returns a redirect
         * to the actual log file.
         */

        const response =
            await fetch(
                `${API}/repos/${OWNER}/${REPO}/actions/jobs/${id}/logs`,
                {
                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            "Bearer " + token,

                        "X-GitHub-Api-Version":
                            API_VERSION
                    }
                }
            );


        if (!response.ok) {

            /*
             * This can happen while GitHub
             * hasn't made the downloadable
             * log available yet.
             */

            return;
        }


        const text =
            await response.text();


        if (!text.trim()) {
            return;
        }


        setLog(
            text
        );


        parseReadyInfo(
            text
        );

    }

    catch (error) {

        console.debug(
            "Log not available yet:",
            error
        );
    }
}


/* =========================================================
   FINAL LOG
========================================================= */

async function loadFinalLogs(
    run
) {

    try {

        const jobs =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${run.id}/jobs?per_page=100`
            );


        const serverJob =
            jobs.jobs?.find(
                j =>
                    j.name ===
                    "server"
            );


        if (
            serverJob
        ) {

            await loadJobLog(
                serverJob.id
            );
        }

    }

    catch (_) {}
}


/* =========================================================
   PARSE SERVER READY
========================================================= */

function parseReadyInfo(
    text
) {

    /*
     * GitHub may prefix log lines
     * with "#", timestamps, spaces,
     * etc.
     *
     * Therefore DON'T require the
     * marker to be at the beginning
     * of a line.
     */

    const ready =
        /SERVER_READY\s*=\s*true/i
            .test(text);


    const endpointMatch =
        text.match(
            /PUBLIC_ENDPOINT\s*=\s*([^\s\r\n]+)/i
        );


    if (endpointMatch) {

        const endpoint =
            endpointMatch[1]
                .trim()
                .replace(
                    /["'`]/g,
                    ""
                );


        addressElement.textContent =
            endpoint;


        serverCard.classList.add(
            "show"
        );
    }


    /*
     * Either marker means the server
     * is ready.
     */

    if (
        ready ||
        endpointMatch
    ) {

        serverOnline =
            true;


        setStatus(
            "🟢 Server is ONLINE",
            "online"
        );


        startButton.disabled =
            true;


        stopButton.disabled =
            false;
    }
}


/* =========================================================
   STOP SERVER
========================================================= */

async function stopServer() {

    if (!workflowRunId) {

        return;
    }


    const confirmed =
        confirm(
            "Stop the L.A. Crimes server?"
        );


    if (!confirmed) {
        return;
    }


    try {

        stopButton.disabled =
            true;


        setStatus(
            "Stopping server...",
            "warning"
        );


        setLog(
            logElement.textContent +

`\n
======================================
STOP REQUEST
======================================

Cancelling GitHub Actions workflow...`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/cancel`,
            {
                method:
                    "POST"
            }
        );


        setStatus(
            "Stopping server...",
            "warning"
        );


        /*
         * Keep polling until GitHub
         * reports the run as completed.
         */

        beginPolling();

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Failed to stop server",
            "error"
        );


        stopButton.disabled =
            false;


        setLog(
            logElement.textContent +

`\n
STOP ERROR:

${error.message}`
        );
    }
}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    () => {

        /*
         * If there's a token from this
         * browser session, automatically
         * reconnect.
         */

        if (
            tokenInput.value.trim()
        ) {

            recoverServer();

        } else {

            setStatus(
                "Enter GitHub token"
            );

            runInfo.textContent =
                "Ready";
        }
    }
);

</script>

</body>
           </html>
