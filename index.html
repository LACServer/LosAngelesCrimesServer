<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>L.A. Crimes Server</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 10% 10%, rgba(80,120,255,.25), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(180,60,255,.20), transparent 35%),
        #070914;
}

.container {
    width: min(1100px, calc(100% - 24px));
    margin: 28px auto;
}

.glass {
    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 24px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.header {
    padding: 28px;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.header p {
    margin: 0;
    opacity: .6;
}

.controls {
    padding: 22px;
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    opacity: .65;
}

input {
    width: 100%;
    padding: 14px;

    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.13);

    background: rgba(0,0,0,.30);
    color: white;

    outline: none;
}

input:focus {
    border-color: rgba(120,160,255,.7);
}

.small {
    margin-top: 7px;
    font-size: 12px;
    opacity: .45;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
}

button {
    padding: 13px 20px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;

    background: rgba(255,255,255,.10);
    color: white;

    font-weight: bold;
    cursor: pointer;

    transition: .15s;
}

button:hover:not(:disabled) {
    background: rgba(255,255,255,.18);
    transform: translateY(-1px);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.start {
    background: rgba(60,190,100,.25);
}

.stop {
    background: rgba(220,60,60,.25);
}

.status {
    padding: 18px 22px;
    margin-bottom: 16px;

    display: flex;
    align-items: center;
    gap: 12px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #777;
    flex-shrink: 0;
}

.server-card {
    display: none;
    padding: 22px;
    margin-bottom: 16px;
}

.server-card.show {
    display: block;
}

.server-address {
    margin-top: 8px;
    font-size: 24px;
    font-weight: bold;
    word-break: break-all;
}

.log-card {
    padding: 22px;
}

.log {
    margin-top: 14px;

    height: 500px;
    overflow-y: auto;

    padding: 16px;

    border-radius: 16px;

    background: rgba(0,0,0,.42);

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;
    line-height: 1.5;

    white-space: pre-wrap;
    word-break: break-word;
}

.online {
    color: #73ff9a;
}

.error {
    color: #ff7777;
}

.warning {
    color: #ffd36b;
}

@media(max-width:600px) {

    .container {
        margin: 12px auto;
    }

    .header h1 {
        font-size: 24px;
    }

    .log {
        height: 400px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="glass header">
        <h1>🎮 L.A. Crimes Server</h1>
        <p>GitHub Actions powered server dashboard</p>
    </div>


    <div class="glass controls">

        <label>
            GitHub Personal Access Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="github_pat_..."
            autocomplete="off"
        >

        <div class="small">
            Your token is kept only in this browser tab.
        </div>


        <div class="buttons">

            <button
                id="start"
                class="start"
                onclick="startServer()"
            >
                ▶ Start Server
            </button>

            <button
                id="stop"
                class="stop"
                onclick="stopServer()"
                disabled
            >
                ■ Stop Server
            </button>

        </div>

    </div>


    <div class="glass status">

        <div
            id="dot"
            class="dot"
        ></div>

        <div>

            <div id="status">
                Server offline
            </div>

            <div
                id="run"
                class="small"
            >
                No workflow running
            </div>

        </div>

    </div>


    <div
        id="serverCard"
        class="glass server-card"
    >

        <div class="small">
            PUBLIC SERVER
        </div>

        <div
            id="address"
            class="server-address"
        >
            Waiting...
        </div>

        <div class="small">
            Map: City · UDP 7777
        </div>

    </div>


    <div class="glass log-card">

        <strong>
            Live Server Log
        </strong>

        <div
            id="log"
            class="log"
        >Waiting for server...</div>

    </div>

</div>


<script>

/* =========================================
   CONFIGURATION
========================================= */

const OWNER =
    "LACServer";

const REPO =
    "LosAngelesCrimesServer";

const WORKFLOW =
    "main.yml";

const BRANCH =
    "main";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";


/* =========================================
   STATE
========================================= */

let runId = null;
let jobId = null;

let pollTimer = null;

let previousLog = "";


/* =========================================
   TOKEN
========================================= */

function getToken() {

    const token =
        document
            .getElementById("token")
            .value
            .trim();

    if (!token) {

        throw new Error(
            "Enter your GitHub token first."
        );
    }

    return token;
}


/* =========================================
   GITHUB API
========================================= */

async function github(
    path,
    options = {}
) {

    const token =
        getToken();

    let response;

    try {

        response =
            await fetch(
                API + path,
                {
                    ...options,

                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            `Bearer ${token}`,

                        "X-GitHub-Api-Version":
                            API_VERSION,

                        ...(options.headers || {})
                    }
                }
            );

    } catch (error) {

        throw new Error(
            "Failed to connect to GitHub API.\n\n" +
            "Check your internet connection."
        );
    }


    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.message) {
                message =
                    data.message;
            }

        } catch {}

        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (response.status === 204) {
        return null;
    }


    return response.json();
}


/* =========================================
   STATUS
========================================= */

function setStatus(
    text,
    type = ""
) {

    const status =
        document.getElementById("status");

    const dot =
        document.getElementById("dot");


    status.textContent =
        text;


    if (type === "online") {

        status.className =
            "online";

        dot.style.background =
            "#73ff9a";

        dot.style.boxShadow =
            "0 0 14px #73ff9a";

    }

    else if (type === "error") {

        status.className =
            "error";

        dot.style.background =
            "#ff7777";

        dot.style.boxShadow =
            "0 0 14px #ff7777";

    }

    else if (type === "warning") {

        status.className =
            "warning";

        dot.style.background =
            "#ffd36b";

        dot.style.boxShadow =
            "0 0 14px #ffd36b";

    }

    else {

        status.className =
            "";

        dot.style.background =
            "#777";

        dot.style.boxShadow =
            "none";
    }
}


/* =========================================
   LOG
========================================= */

function showLog(text) {

    const log =
        document.getElementById("log");

    log.textContent =
        text ||
        "Waiting for log...";

    log.scrollTop =
        log.scrollHeight;
}


/* =========================================
   START SERVER
========================================= */

async function startServer() {

    const startButton =
        document.getElementById("start");

    const stopButton =
        document.getElementById("stop");


    try {

        startButton.disabled =
            true;

        stopButton.disabled =
            true;


        document
            .getElementById("serverCard")
            .classList
            .remove("show");


        previousLog = "";


        showLog(
            "Connecting to GitHub...\n"
        );


        setStatus(
            "Checking workflow...",
            "warning"
        );


        /*
         * First make sure main.yml exists.
         */

        const workflow =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}`
            );


        if (
            workflow.state !==
            "active"
        ) {

            throw new Error(
                "main.yml exists, but the workflow is not active."
            );
        }


        showLog(
            `✓ Workflow found\n` +
            `Name: ${workflow.name}\n` +
            `File: .github/workflows/${WORKFLOW}\n\n` +
            `Starting workflow...`
        );


        /*
         * Start main.yml.
         */

        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
            {
                method: "POST",

                body:
                    JSON.stringify({
                        ref: BRANCH
                    })
            }
        );


        /*
         * GitHub's dispatch endpoint historically
         * may return 204, so find the new run
         * ourselves.
         */

        showLog(
            `✓ Workflow started.\n\n` +
            `Waiting for GitHub to create the run...`
        );


        setStatus(
            "Workflow starting...",
            "warning"
        );


        runId =
            await findNewestRun();


        if (!runId) {

            throw new Error(
                "The workflow was started, but GitHub did not return a new run yet."
            );
        }


        document
            .getElementById("run")
            .textContent =
            `Run ID: ${runId}`;


        showLog(
            `✓ Run found: ${runId}\n\n` +
            `Waiting for server job...`
        );


        stopButton.disabled =
            false;


        startPolling();

    }

    catch (error) {

        console.error(error);


        setStatus(
            "Failed to start",
            "error"
        );


        showLog(
            "ERROR:\n\n" +
            error.message
        );


        startButton.disabled =
            false;

        stopButton.disabled =
            true;
    }
}


/* =========================================
   FIND NEWEST RUN
========================================= */

async function findNewestRun() {

    for (
        let attempt = 0;
        attempt < 20;
        attempt++
    ) {

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=10`
            );


        const runs =
            data.workflow_runs || [];


        if (runs.length > 0) {

            /*
             * The newest workflow_dispatch run
             * belongs to the button press.
             */

            return runs[0].id;
        }


        await sleep(2000);
    }


    return null;
}


/* =========================================
   POLLING
========================================= */

function startPolling() {

    clearInterval(
        pollTimer
    );


    pollServer();


    /*
     * Update every 10 seconds.
     */

    pollTimer =
        setInterval(
            pollServer,
            10000
        );
}


/* =========================================
   POLL
========================================= */

async function pollServer() {

    if (!runId) {
        return;
    }


    try {

        const run =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${runId}`
            );


        document
            .getElementById("run")
            .textContent =
            `Run ${runId} · ${run.status}`;


        /*
         * Find jobs.
         */

        const jobs =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${runId}/jobs?per_page=100`
            );


        const list =
            jobs.jobs || [];


        const job =
            list.find(
                j =>
                    j.name === "server"
            ) ||
            list.find(
                j =>
                    j.name
                        .toLowerCase()
                        .includes("server")
            );


        if (job) {

            jobId =
                job.id;

            await downloadJobLog(
                job.id
            );
        }


        /*
         * Workflow finished.
         */

        if (
            run.status ===
            "completed"
        ) {

            clearInterval(
                pollTimer
            );


            if (
                run.conclusion ===
                "success"
            ) {

                setStatus(
                    "Server stopped",
                    ""
                );

            }

            else if (
                run.conclusion ===
                "cancelled"
            ) {

                setStatus(
                    "Server stopped",
                    ""
                );

            }

            else {

                setStatus(
                    "Server failed",
                    "error"
                );
            }


            document
                .getElementById("start")
                .disabled =
                false;

            document
                .getElementById("stop")
                .disabled =
                true;
        }

    }

    catch (error) {

        console.error(error);

        /*
         * Don't kill polling just because one
         * log request failed.
         */

        const old =
            document
                .getElementById("log")
                .textContent;


        showLog(
            old +
            "\n\n[DASHBOARD ERROR]\n" +
            error.message
        );
    }
}


/* =========================================
   DOWNLOAD JOB LOG
========================================= */

async function downloadJobLog(
    id
) {

    const token =
        getToken();


    let response;


    try {

        /*
         * GitHub returns a redirect to the
         * actual plain-text log file.
         */

        response =
            await fetch(
                `${API}/repos/${OWNER}/${REPO}/actions/jobs/${id}/logs`,
                {
                    method: "GET",

                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            `Bearer ${token}`,

                        "X-GitHub-Api-Version":
                            API_VERSION
                    },

                    redirect:
                        "follow"
                }
            );

    }

    catch {

        return;
    }


    /*
     * The job may still be initializing.
     */

    if (!response.ok) {
        return;
    }


    const contentType =
        response.headers
            .get("content-type") ||
        "";


    /*
     * GitHub normally gives text here after
     * following the redirect.
     */

    let text = "";


    if (
        contentType
            .toLowerCase()
            .includes("text")
    ) {

        text =
            await response.text();

    }

    else {

        /*
         * Some GitHub responses don't expose
         * the content type correctly.
         */

        try {

            text =
                await response.text();

        }

        catch {

            return;
        }
    }


    if (!text.trim()) {
        return;
    }


    previousLog =
        text;


    showLog(text);


    parseServerLog(text);
}


/* =========================================
   PARSE SERVER LOG
========================================= */

function parseServerLog(
    text
) {

    /*
     * The workflow should print:
     *
     * SERVER_READY=true
     *
     * when the server and tunnel are ready.
     */

    if (
        /SERVER_READY\s*=\s*true/i
            .test(text)
    ) {

        setStatus(
            "🟢 Server is ONLINE",
            "online"
        );
    }


    /*
     * Find:
     *
     * PUBLIC_ENDPOINT=nl.portbuddy.tech:40083
     */

    const endpoint =
        text.match(
            /PUBLIC_ENDPOINT\s*=\s*(\S+)/i
        );


    if (endpoint) {

        document
            .getElementById("address")
            .textContent =
            endpoint[1];


        document
            .getElementById("serverCard")
            .classList
            .add("show");
    }


    /*
     * Also support:
     *
     * PUBLIC: nl.portbuddy.tech:40083
     */

    const publicLine =
        text.match(
            /PUBLIC:\s+(\S+)/i
        );


    if (
        publicLine &&
        !endpoint
    ) {

        document
            .getElementById("address")
            .textContent =
            publicLine[1];


        document
            .getElementById("serverCard")
            .classList
            .add("show");
    }
}


/* =========================================
   STOP SERVER
========================================= */

async function stopServer() {

    if (!runId) {

        setStatus(
            "No active server",
            "warning"
        );

        return;
    }


    const confirmed =
        confirm(
            "Stop the L.A. Crimes server?"
        );


    if (!confirmed) {
        return;
    }


    try {

        setStatus(
            "Stopping server...",
            "warning"
        );


        document
            .getElementById("stop")
            .disabled =
            true;


        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${runId}/cancel`,
            {
                method: "POST"
            }
        );


        showLog(
            document
                .getElementById("log")
                .textContent +
            "\n\n✓ Stop request sent to GitHub."
        );


    }

    catch (error) {

        console.error(error);


        setStatus(
            "Failed to stop",
            "error"
        );


        showLog(
            document
                .getElementById("log")
                .textContent +
            "\n\nSTOP ERROR:\n" +
            error.message
        );


        document
            .getElementById("stop")
            .disabled =
            false;
    }
}


/* =========================================
   SLEEP
========================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

</script>

</body>
        </html>
