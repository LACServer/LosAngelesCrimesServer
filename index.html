<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L.A. Crimes Server</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --glass: rgba(255,255,255,.075);
    --glass-strong: rgba(255,255,255,.12);
    --border: rgba(255,255,255,.16);

    --green: #65ff9b;
    --red: #ff6262;
    --blue: #71a7ff;
    --purple: #b678ff;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    overflow-x: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(80,130,255,.30),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(190,80,255,.22),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(50,255,170,.12),
            transparent 35%
        ),
        #050711;

    background-attachment: fixed;
}


/* ==================================================
   BACKGROUND 3D ORBS
================================================== */

body::before,
body::after {
    content: "";

    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(55px);

    opacity: .35;

    z-index: -1;

    animation:
        floatOrb 12s ease-in-out infinite alternate;
}

body::before {
    left: -100px;
    top: 35%;

    background:
        radial-gradient(
            circle,
            rgba(70,130,255,.8),
            transparent 70%
        );
}

body::after {
    right: -100px;
    bottom: 5%;

    background:
        radial-gradient(
            circle,
            rgba(180,70,255,.8),
            transparent 70%
        );

    animation-delay: -5s;
}

@keyframes floatOrb {

    from {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(0,-50px,0)
            scale(1.18);
    }
}


/* ==================================================
   CONTAINER
================================================== */

.container {
    width: min(
        1100px,
        calc(100% - 28px)
    );

    margin:
        35px auto
        60px;
}


/* ==================================================
   GLASS
================================================== */

.glass {
    position: relative;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        var(--border);

    border-radius: 26px;

    box-shadow:
        0 30px 70px rgba(0,0,0,.42),
        0 10px 25px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 -1px 0 rgba(255,255,255,.025);

    backdrop-filter:
        blur(24px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(140%);

    overflow: hidden;

    transform:
        perspective(1200px)
        translateZ(0);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


/*
    Glass reflection.
*/

.glass::before {
    content: "";

    position: absolute;

    left: -20%;
    top: -60%;

    width: 140%;
    height: 100%;

    background:
        linear-gradient(
            120deg,
            transparent 35%,
            rgba(255,255,255,.08),
            transparent 65%
        );

    transform:
        rotate(-8deg);

    pointer-events: none;
}


/*
    Tiny glass edge.
*/

.glass::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    pointer-events: none;

    box-shadow:
        inset 0 0 35px
        rgba(255,255,255,.018);
}


/* ==================================================
   HEADER
================================================== */

.header {
    padding: 34px;

    margin-bottom: 18px;

    transform:
        perspective(1000px)
        rotateX(1deg);
}

.header:hover {
    transform:
        perspective(1000px)
        rotateX(0deg)
        translateY(-2px);

    box-shadow:
        0 35px 80px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.16);
}

.header h1 {
    position: relative;

    margin: 0 0 9px;

    font-size:
        clamp(26px, 5vw, 36px);

    letter-spacing:
        -.7px;
}

.header p {
    position: relative;

    margin: 0;

    color:
        rgba(255,255,255,.55);
}


/* ==================================================
   CONTROLS
================================================== */

.controls {
    padding: 24px;

    margin-bottom: 18px;
}

label {
    position: relative;

    display: block;

    margin-bottom: 8px;

    font-size: 13px;

    color:
        rgba(255,255,255,.65);
}

input {
    position: relative;

    width: 100%;

    padding: 15px 16px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius: 16px;

    outline: none;

    color: white;

    background:
        rgba(0,0,0,.30);

    box-shadow:
        inset 0 4px 15px
        rgba(0,0,0,.15);

    transition:
        .2s ease;
}

input:focus {
    border-color:
        rgba(110,160,255,.7);

    background:
        rgba(0,0,0,.38);

    box-shadow:
        0 0 0 4px
        rgba(100,145,255,.08),
        inset 0 4px 15px
        rgba(0,0,0,.15);
}

.small {
    margin-top: 7px;

    font-size: 12px;

    color:
        rgba(255,255,255,.42);
}


/* ==================================================
   BUTTONS
================================================== */

.buttons {
    display: flex;

    gap: 12px;

    margin-top: 18px;

    flex-wrap: wrap;
}

button {
    position: relative;

    padding:
        14px 22px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 16px;

    color: white;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.055)
        );

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.25),
        inset 0 1px 0
        rgba(255,255,255,.12);

    transform:
        translateY(0)
        translateZ(0);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease,
        opacity .15s ease;
}

button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.16),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left .5s ease;
}

button:hover:not(:disabled)::before {
    left: 140%;
}

button:hover:not(:disabled) {
    transform:
        translateY(-3px)
        translateZ(8px);

    box-shadow:
        0 14px 30px
        rgba(0,0,0,.35),
        inset 0 1px 0
        rgba(255,255,255,.18);
}

button:active:not(:disabled) {
    transform:
        translateY(1px)
        scale(.98);
}

button:disabled {
    opacity: .35;

    cursor: not-allowed;

    box-shadow:
        none;
}

.start {
    background:
        linear-gradient(
            135deg,
            rgba(55,210,110,.28),
            rgba(30,120,70,.12)
        );
}

.start:hover:not(:disabled) {
    background:
        linear-gradient(
            135deg,
            rgba(55,230,120,.38),
            rgba(30,140,75,.18)
        );
}

.stop {
    background:
        linear-gradient(
            135deg,
            rgba(240,70,70,.28),
            rgba(130,30,30,.12)
        );
}

.stop:hover:not(:disabled) {
    background:
        linear-gradient(
            135deg,
            rgba(255,80,80,.40),
            rgba(150,30,30,.18)
        );
}


/* ==================================================
   STATUS
================================================== */

.status {
    padding: 20px 24px;

    margin-bottom: 18px;

    display: flex;

    align-items: center;

    gap: 14px;
}

.dot {
    width: 13px;
    height: 13px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        #777;

    box-shadow:
        0 0 0 transparent;

    transition:
        .25s ease;
}

.status-text {
    font-weight: 750;
}


/* ==================================================
   SERVER CARD
================================================== */

.server-card {
    display: none;

    padding: 24px;

    margin-bottom: 18px;

    transform:
        perspective(1000px)
        rotateX(-1deg);
}

.server-card.show {
    display: block;

    animation:
        serverAppear .4s ease;
}

@keyframes serverAppear {

    from {
        opacity: 0;

        transform:
            perspective(1000px)
            translateY(15px)
            rotateX(-5deg);
    }

    to {
        opacity: 1;

        transform:
            perspective(1000px)
            translateY(0)
            rotateX(-1deg);
    }
}

.server-address {
    margin-top: 8px;

    font-size:
        clamp(20px, 4vw, 28px);

    font-weight: 800;

    letter-spacing:
        -.5px;

    word-break: break-all;

    text-shadow:
        0 0 25px
        rgba(110,255,160,.2);
}


/* ==================================================
   LOG
================================================== */

.log-card {
    padding: 24px;
}

.log {
    margin-top: 15px;

    height: 500px;

    overflow-y: auto;

    padding: 18px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(0,0,0,.48),
            rgba(0,0,0,.30)
        );

    box-shadow:
        inset 0 8px 25px
        rgba(0,0,0,.18);

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: break-word;

    color:
        rgba(255,255,255,.82);
}

.log::-webkit-scrollbar {
    width: 8px;
}

.log::-webkit-scrollbar-track {
    background: transparent;
}

.log::-webkit-scrollbar-thumb {
    background:
        rgba(255,255,255,.13);

    border-radius: 20px;
}


/* ==================================================
   COLORS
================================================== */

.online {
    color:
        var(--green);
}

.error {
    color:
        var(--red);
}

.warning {
    color:
        #ffd36b;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    .container {
        width:
            calc(100% - 18px);

        margin:
            12px auto 30px;
    }

    .header {
        padding: 25px;
    }

    .controls,
    .log-card,
    .server-card {
        padding: 19px;
    }

    .status {
        padding: 17px 19px;
    }

    .log {
        height: 420px;

        padding: 13px;

        font-size: 11px;
    }

    button {
        flex: 1;
    }
}

</style>
</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="glass header">

        <h1>
            🎮 L.A. Crimes Server
        </h1>

        <p>
            GitHub Actions powered public server
        </p>

    </div>


    <!-- CONTROLS -->

    <div class="glass controls">

        <label for="token">
            GitHub Personal Access Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="github_pat_..."
            autocomplete="off"
        >

        <div class="small">
            Your token stays in this browser tab.
        </div>


        <div class="buttons">

            <button
                id="start"
                class="start"
                onclick="startServer()"
            >
                ▶ Start Server
            </button>


            <button
                id="stop"
                class="stop"
                onclick="stopServer()"
                disabled
            >
                ■ Stop Server
            </button>

        </div>

    </div>


    <!-- STATUS -->

    <div class="glass status">

        <div
            id="dot"
            class="dot"
        ></div>


        <div>

            <div
                id="status"
                class="status-text"
            >
                Server offline
            </div>


            <div
                id="runInfo"
                class="small"
            >
                No workflow running
            </div>

        </div>

    </div>


    <!-- SERVER ADDRESS -->

    <div
        id="serverCard"
        class="glass server-card"
    >

        <div class="small">
            PUBLIC SERVER
        </div>


        <div
            id="address"
            class="server-address"
        >
            Waiting...
        </div>


        <div class="small">
            L.A. Crimes · City · UDP
        </div>

    </div>


    <!-- LOG -->

    <div class="glass log-card">

        <strong>
            Live Server Log
        </strong>


        <div
            id="log"
            class="log"
        >Waiting for server...</div>

    </div>

</div>


<script>

/* ==================================================
   CONFIG
================================================== */

const OWNER =
    "LACServer";

const REPO =
    "LosAngelesCrimesServer";

const WORKFLOW_FILE =
    "main.yml";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";


/* ==================================================
   STATE
================================================== */

let workflowRunId =
    null;

let jobId =
    null;

let polling =
    null;

let serverOnline =
    false;


/* ==================================================
   TOKEN
================================================== */

function getToken() {

    const token =
        document
            .getElementById("token")
            .value
            .trim();


    if (!token) {

        throw new Error(
            "Please enter your GitHub token."
        );
    }


    return token;
}


/* ==================================================
   GITHUB API
================================================== */

async function github(
    path,
    options = {}
) {

    const token =
        getToken();


    let response;


    try {

        response =
            await fetch(
                API + path,
                {
                    ...options,

                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            "Bearer " + token,

                        "X-GitHub-Api-Version":
                            API_VERSION,

                        ...(options.headers || {})
                    }
                }
            );

    }

    catch (error) {

        throw new Error(
            "Failed to connect to GitHub API."
        );
    }


    if (!response.ok) {

        let message =
            response.statusText;


        try {

            const data =
                await response.json();


            if (data.message) {

                message =
                    data.message;
            }

        }

        catch (_) {}


        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (
        response.status ===
        204
    ) {

        return null;
    }


    return response.json();
}


/* ==================================================
   STATUS
================================================== */

function setStatus(
    text,
    type = ""
) {

    const status =
        document
            .getElementById("status");

    const dot =
        document
            .getElementById("dot");


    status.textContent =
        text;


    status.className =
        "status-text " +
        type;


    if (type === "online") {

        dot.style.background =
            "var(--green)";

        dot.style.boxShadow =
            "0 0 18px var(--green)";

    }

    else if (type === "error") {

        dot.style.background =
            "var(--red)";

        dot.style.boxShadow =
            "0 0 18px var(--red)";

    }

    else if (type === "warning") {

        dot.style.background =
            "#ffd36b";

        dot.style.boxShadow =
            "0 0 18px #ffd36b";

    }

    else {

        dot.style.background =
            "#777";

        dot.style.boxShadow =
            "none";
    }
}


/* ==================================================
   LOG
================================================== */

function setLog(text) {

    const log =
        document
            .getElementById("log");


    log.textContent =
        text || "Waiting for log...";


    log.scrollTop =
        log.scrollHeight;
}


/* ==================================================
   SLEEP
================================================== */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* ==================================================
   START
================================================== */

async function startServer() {

    try {

        serverOnline =
            false;


        document
            .getElementById("start")
            .disabled = true;


        document
            .getElementById("stop")
            .disabled = true;


        document
            .getElementById("serverCard")
            .classList.remove("show");


        setStatus(
            "Starting workflow...",
            "warning"
        );


        setLog(
            "======================================\n" +
            "STARTING L.A. CRIMES SERVER\n" +
            "======================================\n\n" +
            "Sending workflow request..."
        );


        const startTime =
            Date.now();


        /*
            Directly start:

            .github/workflows/main.yml
        */

        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
            {
                method: "POST",

                body:
                    JSON.stringify({
                        ref: "main"
                    })
            }
        );


        setLog(
            "======================================\n" +
            "WORKFLOW STARTED\n" +
            "======================================\n\n" +
            "GitHub accepted the request.\n" +
            "Finding the new workflow run..."
        );


        workflowRunId =
            await findNewRun(
                startTime
            );


        if (!workflowRunId) {

            throw new Error(
                "Workflow started but its run could not be found."
            );
        }


        document
            .getElementById("runInfo")
            .textContent =
            "Run ID: " +
            workflowRunId;


        setStatus(
            "Preparing server...",
            "warning"
        );


        setLog(
            "======================================\n" +
            "WORKFLOW RUN FOUND\n" +
            "======================================\n\n" +
            "Run ID: " +
            workflowRunId +
            "\n\n" +
            "Waiting for server job..."
        );


        startPolling();

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Failed to start server",
            "error"
        );


        setLog(
            "======================================\n" +
            "ERROR\n" +
            "======================================\n\n" +
            error.message
        );


        document
            .getElementById("start")
            .disabled = false;


        document
            .getElementById("stop")
            .disabled = true;
    }
}


/* ==================================================
   FIND NEW RUN
================================================== */

async function findNewRun(
    startTime
) {

    for (
        let attempt = 0;
        attempt < 30;
        attempt++
    ) {

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=10`
            );


        const runs =
            data.workflow_runs || [];


        const run =
            runs.find(
                item => {

                    const created =
                        new Date(
                            item.created_at
                        ).getTime();


                    return (
                        created >=
                        startTime - 15000
                    );
                }
            );


        if (run) {

            return run.id;
        }


        await sleep(2000);
    }


    return null;
}


/* ==================================================
   POLLING
================================================== */

function startPolling() {

    if (polling) {

        clearInterval(
            polling
        );
    }


    pollServer();


    /*
        10 seconds.
    */

    polling =
        setInterval(
            pollServer,
            10000
        );
}


/* ==================================================
   POLL
================================================== */

async function pollServer() {

    if (!workflowRunId) {

        return;
    }


    try {

        const run =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}`
            );


        document
            .getElementById("runInfo")
            .textContent =
            `Run ${workflowRunId} · ${run.status}`;


        /*
            If the workflow has completed,
            it is safe to disable Stop.
        */

        if (
            run.status ===
            "completed"
        ) {

            serverOnline =
                false;


            clearInterval(
                polling
            );


            if (
                run.conclusion ===
                "success"
            ) {

                setStatus(
                    "Server stopped",
                    ""
                );

            }

            else if (
                run.conclusion ===
                "cancelled"
            ) {

                setStatus(
                    "Server stopped",
                    ""
                );

            }

            else {

                setStatus(
                    "Server failed",
                    "error"
                );
            }


            document
                .getElementById("start")
                .disabled = false;


            document
                .getElementById("stop")
                .disabled = true;


            return;
        }


        /*
            Get jobs.
        */

        const jobs =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/jobs?per_page=100`
            );


        const list =
            jobs.jobs || [];


        const serverJob =
            list.find(
                job =>
                    job.name ===
                    "server"
            ) ||
            list.find(
                job =>
                    job.name
                        .toLowerCase()
                        .includes("server")
            );


        if (!serverJob) {

            /*
                Don't touch the Stop button here.
            */

            if (!serverOnline) {

                setStatus(
                    "Waiting for server job...",
                    "warning"
                );
            }


            return;
        }


        jobId =
            serverJob.id;


        /*
            Get the latest log.
        */

        await getJobLog(
            jobId
        );


        /*
            IMPORTANT:

            If SERVER_READY was already detected,
            force Stop to remain enabled.

            This prevents another polling cycle
            from accidentally disabling it.
        */

        if (serverOnline) {

            document
                .getElementById("stop")
                .disabled = false;

            setStatus(
                "🟢 Server is ONLINE",
                "online"
            );
        }

    }

    catch (error) {

        console.error(
            "Polling error:",
            error
        );
    }
}


/* ==================================================
   JOB LOG
================================================== */

async function getJobLog(
    id
) {

    const token =
        getToken();


    let response;


    try {

        response =
            await fetch(
                `${API}/repos/${OWNER}/${REPO}/actions/jobs/${id}/logs`,
                {
                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            "Bearer " + token,

                        "X-GitHub-Api-Version":
                            API_VERSION
                    }
                }
            );

    }

    catch (_) {

        return;
    }


    /*
        Log isn't available yet.
    */

    if (!response.ok) {

        return;
    }


    const text =
        await response.text();


    if (!text.trim()) {

        return;
    }


    setLog(
        text
    );


    parseServerLog(
        text
    );
}


/* ==================================================
   PARSE LOG
================================================== */

function parseServerLog(
    text
) {

    /*
        SERVER_READY=true

        This is the important marker
        emitted by the YAML.
    */

    if (
        /SERVER_READY\s*=\s*true/i
            .test(text)
    ) {

        serverOnline =
            true;


        setStatus(
            "🟢 Server is ONLINE",
            "online"
        );


        /*
            FORCE ENABLE.

            This is the fix for your bug.
        */

        document
            .getElementById("stop")
            .disabled = false;
    }


    /*
        PUBLIC_ENDPOINT=nl.portbuddy.tech:40083
    */

    const endpoint =
        text.match(
            /PUBLIC_ENDPOINT\s*=\s*(\S+)/i
        );


    if (endpoint) {

        document
            .getElementById("address")
            .textContent =
            endpoint[1];


        document
            .getElementById("serverCard")
            .classList.add("show");


        /*
            If we have an endpoint,
            the server is definitely running.
        */

        serverOnline =
            true;


        document
            .getElementById("stop")
            .disabled = false;


        setStatus(
            "🟢 Server is ONLINE",
            "online"
        );
    }
}


/* ==================================================
   STOP
================================================== */

async function stopServer() {

    if (!workflowRunId) {

        setStatus(
            "No active server",
            "warning"
        );

        return;
    }


    if (
        !confirm(
            "Stop the L.A. Crimes server?"
        )
    ) {

        return;
    }


    try {

        document
            .getElementById("stop")
            .disabled = true;


        setStatus(
            "Stopping server...",
            "warning"
        );


        setLog(
            document
                .getElementById("log")
                .textContent +

            "\n\n======================================\n" +
            "STOP REQUEST SENT\n" +
            "======================================\n\n" +

            "GitHub is stopping the workflow..."
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/cancel`,
            {
                method: "POST"
            }
        );


        serverOnline =
            false;


    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Failed to stop server",
            "error"
        );


        setLog(
            document
                .getElementById("log")
                .textContent +

            "\n\nSTOP ERROR:\n" +

            error.message
        );


        /*
            Re-enable because the stop
            request failed.
        */

        document
            .getElementById("stop")
            .disabled = false;
    }
}


/* ==================================================
   ENTER KEY
================================================== */

document
    .getElementById("token")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                startServer();
            }
        }
    );

</script>
