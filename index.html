<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>L.A. Crimes Server</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #0b0d14;
    --card: #151925;
    --card2: #1b1f2d;

    --text: #f2f3f8;
    --muted: #8e94a8;

    --purple: #b8a5ff;
    --blue: #91c7ff;
    --green: #8ff0b5;
    --yellow: #f5d67e;
    --red: #ff9cad;

    --border: rgba(255,255,255,.09);
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(184,165,255,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(145,199,255,.11),
            transparent 30%
        ),
        var(--bg);

    padding: 20px;
}

.container {
    width: min(850px, 100%);
    margin: auto;
}

.card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:
        1px solid var(--border);

    border-radius: 20px;

    padding: 22px;

    margin-bottom: 16px;

    backdrop-filter:
        blur(14px);

    box-shadow:
        0 18px 45px rgba(0,0,0,.25);
}

.header {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 54px;
    height: 54px;

    display: grid;
    place-items: center;

    border-radius: 16px;

    background:
        rgba(184,165,255,.13);

    border:
        1px solid
        rgba(184,165,255,.2);

    font-size: 26px;
}

h1 {
    margin: 0;

    font-size:
        clamp(25px, 6vw, 34px);
}

.subtitle {
    color: var(--muted);

    font-size: 12px;

    margin-top: 4px;
}

label {
    display: block;

    font-weight: 800;

    font-size: 13px;

    margin-bottom: 8px;
}

input {
    width: 100%;

    height: 48px;

    padding: 0 14px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,255,255,.1);

    outline: none;

    background:
        rgba(0,0,0,.25);

    color: var(--text);
}

input:focus {
    border-color:
        rgba(184,165,255,.55);
}

.small {
    color: var(--muted);

    font-size: 11px;

    margin-top: 6px;
}

.buttons {
    display: flex;

    gap: 10px;

    margin-top: 18px;
}

button {
    flex: 1;

    border: 0;

    border-radius: 13px;

    padding: 14px;

    font-weight: 850;

    cursor: pointer;

    transition:
        transform .15s,
        opacity .15s;
}

button:hover:not(:disabled) {
    transform:
        translateY(-2px);
}

button:active:not(:disabled) {
    transform:
        translateY(1px);
}

button:disabled {
    opacity: .35;

    cursor:
        not-allowed;
}

.start {
    background: var(--green);

    color: #183a29;
}

.stop {
    background: var(--red);

    color: #492631;
}

.status {
    display: flex;

    align-items: center;

    gap: 12px;
}

.dot {
    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: #666;
}

.dot.online {
    background: var(--green);

    box-shadow:
        0 0 18px
        rgba(143,240,181,.65);
}

.dot.warning {
    background: var(--yellow);

    box-shadow:
        0 0 15px
        rgba(245,214,126,.5);
}

.dot.error {
    background: var(--red);

    box-shadow:
        0 0 15px
        rgba(255,156,173,.5);
}

.status-title {
    font-weight: 850;
}

.server {
    display: none;
}

.server.show {
    display: block;
}

.address {
    margin-top: 10px;

    padding: 15px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.28);

    color: var(--blue);

    font-family:
        Consolas,
        monospace;

    font-size: 19px;

    font-weight: 850;

    word-break:
        break-all;
}

.log-title {
    display: flex;

    justify-content:
        space-between;

    align-items: center;
}

.badge {
    padding: 5px 9px;

    border-radius: 999px;

    font-size: 10px;

    font-weight: 850;

    background:
        rgba(184,165,255,.1);

    color:
        var(--purple);
}

.log {
    height: 400px;

    overflow-y: auto;

    margin-top: 12px;

    padding: 15px;

    border-radius: 14px;

    background:
        #080a10;

    border:
        1px solid
        rgba(255,255,255,.06);

    color: #dfe2ed;

    font-family:
        Consolas,
        monospace;

    font-size: 12px;

    line-height: 1.5;

    white-space: pre-wrap;

    word-break: break-word;
}

.footer {
    text-align: center;

    color:
        rgba(255,255,255,.25);

    font-size: 10px;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .buttons {
        flex-direction: column;
    }
}

</style>

</head>


<body>

<div class="container">


<div class="card header">

    <div class="logo">
        🎮
    </div>

    <div>

        <h1>
            L.A. Crimes Server
        </h1>

        <div class="subtitle">
            GitHub Actions control panel
        </div>

    </div>

</div>


<div class="card">

    <label>
        GitHub Personal Access Token
    </label>

    <input
        id="token"
        type="password"
        placeholder="github_pat_..."
        autocomplete="off"
    >

    <div class="small">
        The token stays in this browser session.
    </div>


    <div class="buttons">

        <button
            id="start"
            class="start"
            onclick="startServer()"
        >
            ▶ Start Server
        </button>

        <button
            id="stop"
            class="stop"
            onclick="stopServer()"
            disabled
        >
            ■ Stop Server
        </button>

    </div>

</div>


<div class="card status">

    <div
        id="dot"
        class="dot"
    ></div>

    <div>

        <div
            id="status"
            class="status-title"
        >
            Offline
        </div>

        <div
            id="runInfo"
            class="small"
        >
            Checking GitHub...
        </div>

    </div>

</div>


<div
    id="serverCard"
    class="card server"
>

    <strong>
        🌐 Public Server
    </strong>

    <div
        id="address"
        class="address"
    >
        —
    </div>

    <div class="small">
        Map: City · UDP 7777
    </div>

</div>


<div class="card">

    <div class="log-title">

        <strong>
            Server Log
        </strong>

        <span class="badge">
            LIVE
        </span>

    </div>

    <div
        id="log"
        class="log"
    >
Waiting for server...
    </div>

</div>


<div class="footer">
    L.A. Crimes Server Dashboard
</div>


</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const OWNER =
    "LACServer";

const REPO =
    "LosAngelesCrimesServer";

const WORKFLOW =
    "main.yml";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";

const STATUS_CONTEXT =
    "LAC_SERVER";


/* =====================================================
   STATE
===================================================== */

let runId =
    sessionStorage.getItem(
        "lac_run_id"
    );

let pollTimer =
    null;


/* =====================================================
   ELEMENTS
===================================================== */

const tokenInput =
    document.getElementById(
        "token"
    );

const startButton =
    document.getElementById(
        "start"
    );

const stopButton =
    document.getElementById(
        "stop"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const runInfo =
    document.getElementById(
        "runInfo"
    );

const dot =
    document.getElementById(
        "dot"
    );

const logElement =
    document.getElementById(
        "log"
    );

const serverCard =
    document.getElementById(
        "serverCard"
    );

const addressElement =
    document.getElementById(
        "address"
    );


/* =====================================================
   TOKEN
===================================================== */

const savedToken =
    sessionStorage.getItem(
        "lac_token"
    );

if (savedToken) {
    tokenInput.value =
        savedToken;
}


tokenInput.addEventListener(
    "input",
    () => {

        if (
            tokenInput.value.trim()
        ) {

            sessionStorage.setItem(
                "lac_token",
                tokenInput.value.trim()
            );

        } else {

            sessionStorage.removeItem(
                "lac_token"
            );
        }
    }
);


function getToken() {

    const token =
        tokenInput.value.trim();

    if (!token) {
        throw new Error(
            "Enter your GitHub token."
        );
    }

    return token;
}


/* =====================================================
   GITHUB API
===================================================== */

async function github(
    path,
    options = {}
) {

    const response =
        await fetch(
            API + path,
            {
                ...options,

                headers: {
                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + getToken(),

                    "X-GitHub-Api-Version":
                        API_VERSION,

                    ...(options.headers || {})
                }
            }
        );


    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.message) {
                message =
                    data.message;
            }

        } catch (_) {}

        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (response.status === 204) {
        return null;
    }


    return response.json();
}


/* =====================================================
   UI
===================================================== */

function setStatus(
    text,
    type = ""
) {

    statusElement.textContent =
        text;

    dot.className =
        "dot " + type;
}


function setLog(text) {

    logElement.textContent =
        text || "No log.";

    logElement.scrollTop =
        logElement.scrollHeight;
}


/* =====================================================
   START
===================================================== */

async function startServer() {

    try {

        startButton.disabled =
            true;

        stopButton.disabled =
            true;


        setStatus(
            "Starting server...",
            "warning"
        );


        setLog(
`======================================
L.A. CRIMES SERVER
======================================

Sending workflow request...

LAC_SERVER_STATE=PREPARING`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
            {
                method: "POST",

                body:
                    JSON.stringify({
                        ref: "main"
                    })
            }
        );


        setLog(
`======================================
WORKFLOW STARTED
======================================

Waiting for GitHub Actions...

LAC_SERVER_STATE=PREPARING`
        );


        await findActiveRun();


        beginPolling();

    }

    catch (error) {

        setStatus(
            "Start failed",
            "error"
        );

        setLog(
`ERROR:

${error.message}`
        );

        startButton.disabled =
            false;
    }
}


/* =====================================================
   FIND ACTIVE RUN
===================================================== */

async function findActiveRun() {

    for (
        let attempt = 0;
        attempt < 30;
        attempt++
    ) {

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=20`
            );


        const active =
            data.workflow_runs?.find(
                run =>
                    run.event ===
                    "workflow_dispatch" &&
                    (
                        run.status ===
                        "queued" ||
                        run.status ===
                        "in_progress"
                    )
            );


        if (active) {

            runId =
                active.id;

            sessionStorage.setItem(
                "lac_run_id",
                runId
            );

            return active;
        }


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    2000
                )
        );
    }


    throw new Error(
        "The workflow was started but no active run was found."
    );
}


/* =====================================================
   RECOVER AFTER REFRESH
===================================================== */

async function recover() {

    try {

        /*
         * First try the remembered run.
         */

        if (runId) {

            try {

                const run =
                    await github(
                        `/repos/${OWNER}/${REPO}/actions/runs/${runId}`
                    );


                if (
                    run.status !==
                    "completed"
                ) {

                    beginPolling();

                    return;
                }

            } catch (_) {

                runId =
                    null;

                sessionStorage.removeItem(
                    "lac_run_id"
                );
            }
        }


        /*
         * Search GitHub for ANY active
         * workflow.
         */

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=20`
            );


        const active =
            data.workflow_runs?.find(
                run =>
                    run.event ===
                    "workflow_dispatch" &&
                    (
                        run.status ===
                        "queued" ||
                        run.status ===
                        "in_progress"
                    )
            );


        if (active) {

            runId =
                active.id;

            sessionStorage.setItem(
                "lac_run_id",
                runId
            );

            beginPolling();

            return;
        }


        /*
         * Nothing active.
         */

        setStatus(
            "Server offline"
        );

        runInfo.textContent =
            "No active server workflow";

        startButton.disabled =
            false;

        stopButton.disabled =
            true;

    }

    catch (error) {

        setStatus(
            "GitHub connection error",
            "error"
        );

        runInfo.textContent =
            error.message;

        startButton.disabled =
            false;

        stopButton.disabled =
            true;
    }
}


/* =====================================================
   POLLING
===================================================== */

function beginPolling() {

    if (pollTimer) {

        clearInterval(
            pollTimer
        );
    }


    pollServer();


    pollTimer =
        setInterval(
            pollServer,
            10000
        );
}


/* =====================================================
   POLL
===================================================== */

async function pollServer() {

    if (!runId) {
        return;
    }


    try {

        const run =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${runId}`
            );


        runInfo.textContent =
            `Run ${run.id} · GitHub: ${run.status}`;


        /*
         * =============================================
         * WORKFLOW COMPLETED
         * =============================================
         */

        if (
            run.status ===
            "completed"
        ) {

            setStatus(
                "Server offline"
            );

            dot.className =
                "dot";

            startButton.disabled =
                false;

            stopButton.disabled =
                true;

            serverCard.classList.remove(
                "show"
            );


            if (pollTimer) {

                clearInterval(
                    pollTimer
                );

                pollTimer =
                    null;
            }


            setLog(
                logElement.textContent +

`\n
======================================
WORKFLOW COMPLETED
======================================

LAC_SERVER_STATE=OFFLINE`
            );


            sessionStorage.removeItem(
                "lac_run_id"
            );

            runId =
                null;


            return;
        }


        /*
         * =============================================
         * WORKFLOW IS ACTIVE
         * =============================================
         */

        startButton.disabled =
            true;


        /*
         * Get the commit status for THIS run.
         */

        await readServerStatus(
            run.head_sha
        );


        /*
         * Get the live job log as a secondary
         * display. It is NOT used to determine
         * online/offline state.
         */

        await loadLog(
            run.id
        );

    }

    catch (error) {

        console.error(
            error
        );

        runInfo.textContent =
            error.message;
    }
}


/* =====================================================
   READ SPECIAL SERVER STATUS
===================================================== */

async function readServerStatus(
    sha
) {

    const statuses =
        await github(
            `/repos/${OWNER}/${REPO}/commits/${sha}/statuses?per_page=100`
        );


    const serverStatus =
        statuses.find(
            status =>
                status.context ===
                STATUS_CONTEXT
        );


    if (!serverStatus) {

        setStatus(
            "Server preparing...",
            "warning"
        );

        stopButton.disabled =
            true;

        return;
    }


    const description =
        serverStatus.description ||
        "";


    /*
     * =============================================
     * ONLINE
     * =============================================
     */

    if (
        serverStatus.state ===
            "success" &&
        description.includes(
            "LAC_SERVER_ONLINE"
        )
    ) {

        setStatus(
            "🟢 Server ONLINE",
            "online"
        );


        stopButton.disabled =
            false;


        /*
         * Extract endpoint.
         */

        const endpoint =
            description.match(
                /PUBLIC_ENDPOINT=([^|]+)/i
            );


        if (endpoint) {

            addressElement.textContent =
                endpoint[1].trim();

            serverCard.classList.add(
                "show"
            );
        }


        setLog(
            logElement.textContent +

`\n
--------------------------------------
STATUS
--------------------------------------
LAC_SERVER_STATE=ONLINE
SERVER_READY=true
${endpoint ? "PUBLIC_ENDPOINT=" + endpoint[1].trim() : ""}`
        );


        return;
    }


    /*
     * =============================================
     * PREPARING
     * =============================================
     */

    if (
        serverStatus.state ===
        "pending"
    ) {

        setStatus(
            "🟡 Server preparing...",
            "warning"
        );


        stopButton.disabled =
            true;


        return;
    }


    /*
     * =============================================
     * OFFLINE / ERROR
     * =============================================
     */

    if (
        serverStatus.state ===
            "failure" ||
        serverStatus.state ===
            "error"
    ) {

        setStatus(
            "🔴 Server offline",
            "error"
        );


        stopButton.disabled =
            true;


        return;
    }


    setStatus(
        "Server preparing...",
        "warning"
    );

    stopButton.disabled =
        true;
}


/* =====================================================
   LOAD LOG
===================================================== */

async function loadLog(
    id
) {

    try {

        const token =
            getToken();


        const response =
            await fetch(
                `${API}/repos/${OWNER}/${REPO}/actions/runs/${id}/logs`,
                {
                    headers: {
                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            "Bearer " + token,

                        "X-GitHub-Api-Version":
                            API_VERSION
                    }
                }
            );


        /*
         * GitHub may return a redirect/temporary
         * log URL. If that happens, don't let it
         * break the server-state system.
         */

        if (!response.ok) {
            return;
        }


        const text =
            await response.text();


        if (
            text &&
            text.trim()
        ) {

            setLog(text);
        }

    }

    catch (error) {

        console.debug(
            "Live log unavailable:",
            error
        );
    }
}


/* =====================================================
   STOP
===================================================== */

async function stopServer() {

    if (!runId) {

        setStatus(
            "No active server"
        );

        return;
    }


    if (
        !confirm(
            "Stop the L.A. Crimes server?"
        )
    ) {
        return;
    }


    try {

        stopButton.disabled =
            true;


        setStatus(
            "Stopping server...",
            "warning"
        );


        setLog(
            logElement.textContent +

`\n
======================================
STOP REQUEST
======================================

Cancelling GitHub workflow...`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${runId}/cancel`,
            {
                method:
                    "POST"
            }
        );


        /*
         * Keep polling.
         *
         * The workflow will change its special
         * LAC_SERVER status to OFFLINE when it
         * finishes its cleanup.
         */

        beginPolling();

    }

    catch (error) {

        setStatus(
            "Stop failed",
            "error"
        );


        stopButton.disabled =
            false;


        setLog(
            logElement.textContent +

`\n
STOP ERROR:

${error.message}`
        );
    }
}


/* =====================================================
   STARTUP
===================================================== */

window.addEventListener(
    "load",
    () => {

        if (
            tokenInput.value.trim()
        ) {

            recover();

        } else {

            setStatus(
                "Enter GitHub token"
            );

            runInfo.textContent =
                "Ready";
        }
    }
);

</script>

</body>

    </html>
