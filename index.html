<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L.A. Crimes Server</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #0d0f18;
    --card: rgba(28, 31, 48, 0.72);
    --card-light: rgba(255, 255, 255, 0.055);

    --text: #f1f2f7;
    --muted: #9296aa;

    --purple: #b9a7ff;
    --blue: #91c7ff;
    --green: #8ff0b5;
    --red: #ff9cae;
    --yellow: #f4d47c;

    --border: rgba(255,255,255,.10);
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(155, 125, 255, .16),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(95, 170, 255, .13),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(100, 255, 180, .07),
            transparent 35%
        ),
        var(--bg);

    padding: 25px;
}


/* =====================================================
   LAYOUT
===================================================== */

.container {
    width: min(900px, 100%);
    margin: auto;
}


/* =====================================================
   CARDS
===================================================== */

.card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid var(--border);

    border-radius: 22px;

    padding: 24px;

    margin-bottom: 18px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 20px 45px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.06);

    transition:
        transform .2s ease,
        border-color .2s ease;
}

.card:hover {
    transform: translateY(-2px);

    border-color:
        rgba(255,255,255,.15);
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo {
    width: 55px;
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(185,167,255,.22),
            rgba(145,199,255,.08)
        );

    border:
        1px solid
        rgba(185,167,255,.18);

    font-size: 27px;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.25);
}

h1 {
    margin: 0;

    font-size:
        clamp(25px, 5vw, 34px);
}

.subtitle {
    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;
}


/* =====================================================
   INPUT
===================================================== */

label {
    display: block;

    margin-bottom: 8px;

    font-weight: 750;

    font-size: 13px;
}

input {
    width: 100%;
    height: 50px;

    padding: 0 15px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 14px;

    outline: none;

    background:
        rgba(0,0,0,.25);

    color: var(--text);

    font-size: 14px;

    transition:
        border .2s,
        box-shadow .2s;
}

input:focus {
    border-color:
        rgba(185,167,255,.55);

    box-shadow:
        0 0 0 3px
        rgba(185,167,255,.10);
}

.small {
    margin-top: 6px;

    color: var(--muted);

    font-size: 11px;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {
    display: flex;

    gap: 12px;

    margin-top: 19px;
}

button {
    border: 0;

    border-radius: 14px;

    padding:
        14px 22px;

    font-weight: 850;

    font-size: 14px;

    cursor: pointer;

    transition:
        transform .15s ease,
        opacity .15s ease,
        box-shadow .15s ease;
}

button:hover:not(:disabled) {
    transform:
        translateY(-2px);
}

button:active:not(:disabled) {
    transform:
        translateY(1px);
}

button:disabled {
    opacity: .35;

    cursor:
        not-allowed;
}


/* START */

.start {
    color: #253c30;

    background:
        var(--green);

    box-shadow:
        0 6px 0
        #55b97d;
}


/* STOP */

.stop {
    color: #4e2832;

    background:
        var(--red);

    box-shadow:
        0 6px 0
        #bd6577;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    display: flex;

    align-items: center;

    gap: 13px;
}

.dot {
    width: 14px;
    height: 14px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #666;

    transition:
        background .2s,
        box-shadow .2s;
}

.dot.online {
    background:
        var(--green);

    box-shadow:
        0 0 18px
        rgba(143,240,181,.7);
}

.dot.warning {
    background:
        var(--yellow);

    box-shadow:
        0 0 15px
        rgba(244,212,124,.45);
}

.dot.error {
    background:
        var(--red);

    box-shadow:
        0 0 15px
        rgba(255,156,174,.5);
}

.status-title {
    font-weight: 850;
}


/* =====================================================
   SERVER CARD
===================================================== */

.server {
    display: none;
}

.server.show {
    display: block;

    animation:
        appear .25s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.address {
    margin-top: 9px;

    padding: 15px;

    border-radius: 15px;

    background:
        rgba(0,0,0,.28);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:
        var(--blue);

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size:
        clamp(16px, 4vw, 22px);

    font-weight: 850;

    word-break:
        break-all;
}


/* =====================================================
   LOG
===================================================== */

.log-header {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.badge {
    padding:
        5px 10px;

    border-radius:
        999px;

    color:
        var(--purple);

    background:
        rgba(185,167,255,.10);

    border:
        1px solid
        rgba(185,167,255,.15);

    font-size:
        10px;

    font-weight:
        850;
}

.log {
    height: 430px;

    overflow-y: auto;

    margin-top: 13px;

    padding: 16px;

    border-radius: 16px;

    background:
        rgba(5,6,12,.80);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:
        #dfe2ee;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 12px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break:
        break-word;
}

.log::-webkit-scrollbar {
    width: 7px;
}

.log::-webkit-scrollbar-thumb {
    background:
        rgba(255,255,255,.13);

    border-radius:
        20px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    text-align: center;

    color:
        rgba(255,255,255,.25);

    font-size: 10px;

    margin-top: 25px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .header {
        align-items: flex-start;
    }
}

</style>
</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="card header">

        <div class="logo">
            🎮
        </div>

        <div>

            <h1>
                L.A. Crimes Server
            </h1>

            <div class="subtitle">
                GitHub Actions server control panel
            </div>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="card">

        <label for="token">
            GitHub Personal Access Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="github_pat_..."
            autocomplete="off"
        >

        <div class="small">
            Stored only for this browser session.
        </div>


        <div class="buttons">

            <button
                id="start"
                class="start"
                onclick="startServer()"
            >
                ▶ Start Server
            </button>

            <button
                id="stop"
                class="stop"
                onclick="stopServer()"
                disabled
            >
                ■ Stop Server
            </button>

        </div>

    </div>


    <!-- STATUS -->

    <div class="card status">

        <div
            id="dot"
            class="dot"
        ></div>

        <div>

            <div
                id="status"
                class="status-title"
            >
                Enter GitHub token
            </div>

            <div
                id="runInfo"
                class="small"
            >
                No active workflow detected
            </div>

        </div>

    </div>


    <!-- SERVER -->

    <div
        id="serverCard"
        class="card server"
    >

        <strong>
            🌐 Public Server
        </strong>

        <div
            id="address"
            class="address"
        >
            Waiting...
        </div>

        <div class="small">
            Map: City · UDP
        </div>

    </div>


    <!-- LOG -->

    <div class="card">

        <div class="log-header">

            <strong>
                Server Log
            </strong>

            <span class="badge">
                LIVE
            </span>

        </div>

        <div
            id="log"
            class="log"
        >Waiting...</div>

    </div>


    <div class="footer">
        L.A. Crimes Server Control
    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const OWNER =
    "LACServer";

const REPO =
    "LosAngelesCrimesServer";

const WORKFLOW =
    "main.yml";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";


/* =========================================================
   STATE
========================================================= */

let workflowRunId =
    sessionStorage.getItem(
        "lac_workflow_run"
    );

let jobId =
    sessionStorage.getItem(
        "lac_job_id"
    );

let pollTimer =
    null;

let serverOnline =
    false;


/* =========================================================
   ELEMENTS
========================================================= */

const tokenInput =
    document.getElementById(
        "token"
    );

const startButton =
    document.getElementById(
        "start"
    );

const stopButton =
    document.getElementById(
        "stop"
    );

const statusText =
    document.getElementById(
        "status"
    );

const runInfo =
    document.getElementById(
        "runInfo"
    );

const dot =
    document.getElementById(
        "dot"
    );

const logElement =
    document.getElementById(
        "log"
    );

const serverCard =
    document.getElementById(
        "serverCard"
    );

const addressElement =
    document.getElementById(
        "address"
    );


/* =========================================================
   TOKEN SESSION STORAGE
========================================================= */

const savedToken =
    sessionStorage.getItem(
        "lac_github_token"
    );

if (savedToken) {
    tokenInput.value =
        savedToken;
}


tokenInput.addEventListener(
    "input",
    () => {

        const value =
            tokenInput.value.trim();

        if (value) {

            sessionStorage.setItem(
                "lac_github_token",
                value
            );

        } else {

            sessionStorage.removeItem(
                "lac_github_token"
            );
        }
    }
);


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    const token =
        tokenInput.value.trim();

    if (!token) {

        throw new Error(
            "Enter your GitHub token first."
        );
    }

    return token;
}


/* =========================================================
   GITHUB API
========================================================= */

async function github(
    path,
    options = {}
) {

    const token =
        getToken();


    const response =
        await fetch(
            API + path,
            {
                ...options,

                headers: {

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + token,

                    "X-GitHub-Api-Version":
                        API_VERSION,

                    ...(options.headers || {})
                }
            }
        );


    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.message) {
                message =
                    data.message;
            }

        } catch (_) {}

        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (response.status === 204) {
        return null;
    }


    return response.json();
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
) {

    statusText.textContent =
        text;

    dot.className =
        "dot " + type;
}


/* =========================================================
   LOG
========================================================= */

function setLog(text) {

    logElement.textContent =
        text || "No log available.";

    logElement.scrollTop =
        logElement.scrollHeight;
}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   START SERVER
========================================================= */

async function startServer() {

    try {

        startButton.disabled =
            true;

        stopButton.disabled =
            true;

        serverOnline =
            false;


        setStatus(
            "Starting server...",
            "warning"
        );


        setLog(
`======================================
STARTING L.A. CRIMES SERVER
======================================

Sending workflow request...`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        ref:
                            "main"
                    })
            }
        );


        setLog(
`======================================
WORKFLOW STARTED
======================================

GitHub accepted the request.

Finding workflow run...`
        );


        const run =
            await waitForNewRun();


        if (!run) {

            throw new Error(
                "Workflow started, but its run could not be found."
            );
        }


        workflowRunId =
            run.id;


        sessionStorage.setItem(
            "lac_workflow_run",
            workflowRunId
        );


        runInfo.textContent =
            `Run ${workflowRunId} · GitHub: ${run.status}`;


        beginPolling();

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Failed to start",
            "error"
        );


        setLog(
`======================================
ERROR
======================================

${error.message}`
        );


        startButton.disabled =
            false;

        stopButton.disabled =
            true;
    }
}


/* =========================================================
   FIND NEW RUN
========================================================= */

async function waitForNewRun() {

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const data =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=10`
            );


        const run =
            data.workflow_runs?.find(
                item =>
                    item.status ===
                        "queued" ||
                    item.status ===
                        "in_progress"
            );


        if (run) {
            return run;
        }


        await sleep(
            2000
        );
    }


    return null;
}


/* =========================================================
   RECOVER AFTER REFRESH
========================================================= */

async function recoverServer() {

    try {

        setStatus(
            "Checking GitHub...",
            "warning"
        );


        /*
         * First check the run we already know.
         */

        if (workflowRunId) {

            try {

                const run =
                    await github(
                        `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}`
                    );


                if (
                    run.status !==
                    "completed"
                ) {

                    runInfo.textContent =
                        `Run ${run.id} · GitHub: ${run.status}`;

                    beginPolling();

                    return;
                }

            }

            catch (_) {

                workflowRunId =
                    null;

                sessionStorage.removeItem(
                    "lac_workflow_run"
                );
            }
        }


        /*
         * No known run.
         *
         * Search for an active
         * workflow.
         */

        const active =
            await github(
                `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?status=in_progress&per_page=10`
            );


        let run =
            active.workflow_runs?.find(
                item =>
                    item.event ===
                    "workflow_dispatch"
            );


        /*
         * Also check queued.
         */

        if (!run) {

            const queued =
                await github(
                    `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?status=queued&per_page=10`
                );


            run =
                queued.workflow_runs?.find(
                    item =>
                        item.event ===
                        "workflow_dispatch"
                );
        }


        if (run) {

            workflowRunId =
                run.id;


            sessionStorage.setItem(
                "lac_workflow_run",
                workflowRunId
            );


            runInfo.textContent =
                `Run ${run.id} · GitHub: ${run.status}`;


            beginPolling();

            return;
        }


        /*
         * Nothing running.
         */

        setStatus(
            "Server offline"
        );


        runInfo.textContent =
            "No active workflow";


        startButton.disabled =
            false;

        stopButton.disabled =
            true;

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "GitHub connection error",
            "error"
        );


        runInfo.textContent =
            error.message;


        startButton.disabled =
            false;

        stopButton.disabled =
            true;
    }
}


/* =========================================================
   START POLLING
========================================================= */

function beginPolling() {

    if (pollTimer) {

        clearInterval(
            pollTimer
        );
    }


    pollServer();


    /*
     * 10 seconds.
     */

    pollTimer =
        setInterval(
            pollServer,
            10000
        );
}


/* =========================================================
   POLL SERVER
========================================================= */

async function pollServer() {

    if (!workflowRunId) {
        return;
    }


    try {

        const run =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}`
            );


        runInfo.textContent =
            `Run ${run.id} · GitHub: ${run.status}`;


        /*
         * ================================================
         * IMPORTANT:
         *
         * completed = workflow really ended.
         * in_progress does NOT mean server is preparing.
         *
         * Keep server alive deliberately keeps
         * GitHub in_progress while the actual
         * game server is ONLINE.
         * ================================================
         */

        if (
            run.status ===
            "completed"
        ) {

            serverOnline =
                false;


            if (pollTimer) {

                clearInterval(
                    pollTimer
                );

                pollTimer =
                    null;
            }


            sessionStorage.removeItem(
                "lac_workflow_run"
            );

            sessionStorage.removeItem(
                "lac_job_id"
            );


            workflowRunId =
                null;

            jobId =
                null;


            setStatus(
                "Server offline"
            );


            startButton.disabled =
                false;

            stopButton.disabled =
                true;


            await loadFinalLogs(
                run
            );


            return;
        }


        /*
         * Workflow is still alive.
         */

        startButton.disabled =
            true;


        /*
         * Find server job.
         */

        const jobs =
            await github(
                `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/jobs?per_page=100`
            );


        const serverJob =
            jobs.jobs?.find(
                job =>
                    job.name ===
                    "server"
            );


        if (!serverJob) {

            setStatus(
                "Server preparing...",
                "warning"
            );

            return;
        }


        jobId =
            serverJob.id;


        sessionStorage.setItem(
            "lac_job_id",
            jobId
        );


        /*
         * Try to get the log.
         */

        await loadJobLog(
            jobId
        );


        /*
         * DO NOT overwrite ONLINE here.
         *
         * parseReadyInfo() is responsible
         * for changing serverOnline.
         */

        if (serverOnline) {

            setStatus(
                "🟢 Server is ONLINE",
                "online"
            );


            startButton.disabled =
                true;

            stopButton.disabled =
                false;

        } else {

            setStatus(
                "Server preparing...",
                "warning"
            );


            startButton.disabled =
                true;

            stopButton.disabled =
                true;
        }

    }

    catch (error) {

        console.error(
            "Polling error:",
            error
        );
    }
}


/* =========================================================
   LOAD JOB LOG
========================================================= */

async function loadJobLog(
    id
) {

    try {

        const token =
            getToken();


        const response =
            await fetch(
                `${API}/repos/${OWNER}/${REPO}/actions/jobs/${id}/logs`,
                {
                    headers: {

                        "Accept":
                            "application/vnd.github+json",

                        "Authorization":
                            "Bearer " + token,

                        "X-GitHub-Api-Version":
                            API_VERSION
                    }
                }
            );


        if (!response.ok) {
            return;
        }


        const text =
            await response.text();


        if (!text.trim()) {
            return;
        }


        setLog(
            text
        );


        parseReadyInfo(
            text
        );

    }

    catch (error) {

        console.debug(
            "Job log not available yet."
        );
    }
}


/* =========================================================
   PARSE SERVER READY
========================================================= */

function parseReadyInfo(
    text
) {

    /*
     * IMPORTANT:
     *
     * We DON'T require the marker
     * to be at the beginning of a line.
     *
     * GitHub can format the log like:
     *
     * # SERVER_READY=true
     *
     * or:
     *
     * SERVER_READY=true
     *
     * or even put multiple values
     * around the same log section.
     */

    const ready =
        /SERVER_READY\s*=\s*true/i
            .test(text);


    const endpointMatch =
        text.match(
            /PUBLIC_ENDPOINT\s*=\s*([^\s\r\n]+)/i
        );


    /*
     * Public address found.
     */

    if (endpointMatch) {

        const endpoint =
            endpointMatch[1]
                .trim()
                .replace(
                    /["'`#]/g,
                    ""
                );


        addressElement.textContent =
            endpoint;


        serverCard.classList.add(
            "show"
        );
    }


    /*
     * SERVER_READY=true OR
     * PUBLIC_ENDPOINT=...
     *
     * means the actual game server
     * is ready.
     */

    if (
        ready ||
        endpointMatch
    ) {

        serverOnline =
            true;


        setStatus(
            "🟢 Server is ONLINE",
            "online"
        );


        startButton.disabled =
            true;


        stopButton.disabled =
            false;
    }
}


/* =========================================================
   STOP SERVER
========================================================= */

async function stopServer() {

    if (!workflowRunId) {

        setStatus(
            "No active server",
            "warning"
        );

        return;
    }


    if (
        !confirm(
            "Stop the L.A. Crimes server?"
        )
    ) {
        return;
    }


    try {

        stopButton.disabled =
            true;


        setStatus(
            "Stopping server...",
            "warning"
        );


        setLog(
            logElement.textContent +

`\n
======================================
STOP REQUEST
======================================

Cancelling GitHub Actions workflow...`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${workflowRunId}/cancel`,
            {
                method:
                    "POST"
            }
        );


        /*
         * Keep polling until GitHub
         * actually reports completed.
         */

        beginPolling();

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "Failed to stop server",
            "error"
        );


        stopButton.disabled =
            false;


        setLog(
            logElement.textContent +

`\n
STOP ERROR:

${error.message}`
        );
    }
}


/* =========================================================
   INITIAL LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        if (
            tokenInput.value.trim()
        ) {

            /*
             * This is the important part:
             *
             * Refreshing the page searches
             * GitHub for the currently
             * running workflow.
             */

            recoverServer();

        } else {

            setStatus(
                "Enter GitHub token"
            );

            runInfo.textContent =
                "Ready";
        }
    }
);

</script>
