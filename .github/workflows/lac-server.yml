name: L.A. Crimes Linux Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          echo "======================================"
          echo "Installing dependencies"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y unzip wget curl

      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes Linux server
        run: |
          set -e

          echo "======================================"
          echo "Downloading L.A. Crimes v1.9.6"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O LAC_Linux_v1.9.6.zip \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          echo
          echo "Download complete:"
          ls -lh LAC_Linux_v1.9.6.zip

      # ==========================================
      # EXTRACT SERVER
      # ==========================================

      - name: Extract L.A. Crimes server
        run: |
          set -e

          echo "======================================"
          echo "Extracting server"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            LAC_Linux_v1.9.6.zip \
            -d "$GITHUB_WORKSPACE/lac"

          chmod +x \
            "$GITHUB_WORKSPACE/lac/LAC_Linux_v1.9.6.x86_64"

          echo
          echo "Server files:"
          ls -lah "$GITHUB_WORKSPACE/lac"

      # ==========================================
      # CHECK CONFIG FILE FROM REPOSITORY
      # ==========================================

      - name: Check ServerConfig.txt
        run: |
          set -e

          echo "======================================"
          echo "Checking repository configuration"
          echo "======================================"

          CONFIG="$GITHUB_WORKSPACE/config/ServerConfig.txt"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: config/ServerConfig.txt does not exist."
            echo
            echo "Expected:"
            echo "$CONFIG"
            echo
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found:"
          echo "$CONFIG"

          echo
          echo "===== ServerConfig.txt ====="
          cat "$CONFIG"

      # ==========================================
      # INSTALL CONFIG TO GAME'S LINUX LOCATION
      # ==========================================

      - name: Install ServerConfig.txt
        run: |
          set -e

          echo "======================================"
          echo "Installing L.A. Crimes configuration"
          echo "======================================"

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"
          CONFIG_FILE="$CONFIG_DIR/ServerConfig.txt"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/config/ServerConfig.txt" \
            "$CONFIG_FILE"

          sudo chmod 644 "$CONFIG_FILE"

          echo
          echo "Configuration installed at:"
          echo "$CONFIG_FILE"

          echo
          echo "===== INSTALLED CONFIG ====="
          sudo cat "$CONFIG_FILE"

          echo
          echo "===== CONFIG FILE CHECK ====="

          if sudo test -f "$CONFIG_FILE"; then
            echo "SUCCESS: ServerConfig.txt exists."
          else
            echo "ERROR: ServerConfig.txt was not installed."
            exit 1
          fi

      # ==========================================
      # VERIFY PORT
      # ==========================================

      - name: Verify server configuration
        run: |
          set -e

          CONFIG="/root/.config/unity3d/MA/LAC/ServerConfig.txt"

          echo "======================================"
          echo "Verifying server configuration"
          echo "======================================"

          echo
          echo "Map:"
          sudo grep '^map name=' "$CONFIG" || true

          echo
          echo "Port:"
          sudo grep '^starting port=' "$CONFIG" || true

          echo
          echo "Players:"
          sudo grep '^max players=' "$CONFIG" || true

          echo
          echo "Server list:"
          sudo grep '^share to community=' "$CONFIG" || true

          if sudo grep -q '^starting port=7777$' "$CONFIG"; then
            echo
            echo "SUCCESS: Server configured for UDP 7777."
          else
            echo
            echo "ERROR: ServerConfig.txt does not contain:"
            echo "starting port=7777"
            exit 1
          fi

      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes server
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/lac"

          echo "======================================"
          echo "Starting L.A. Crimes Linux server"
          echo "======================================"
          echo
          echo "Version: 1.9.6"
          echo "Map: TrainFacility"
          echo "UDP Port: 7777"
          echo "Max Players: 16"
          echo
          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          SERVER_PID=$!

          echo "$SERVER_PID" > "$GITHUB_WORKSPACE/lac.pid"

          echo
          echo "Server PID:"
          echo "$SERVER_PID"

          echo
          echo "Waiting for server startup..."

          sleep 30

          echo
          echo "===== SERVER PROCESS ====="

          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

          echo
          echo "===== L.A. CRIMES LOG ====="

          cat "$GITHUB_WORKSPACE/lac-server.log" || true

      # ==========================================
      # CHECK SERVER
      # ==========================================

      - name: Check server status
        run: |
          set -e

          echo "======================================"
          echo "Checking L.A. Crimes server"
          echo "======================================"

          if [ ! -f "$GITHUB_WORKSPACE/lac.pid" ]; then
            echo "ERROR: Server PID file does not exist."
            exit 1
          fi

          PID=$(cat "$GITHUB_WORKSPACE/lac.pid")

          echo "Server PID: $PID"

          if kill -0 "$PID" 2>/dev/null; then
            echo "SUCCESS: L.A. Crimes process is running."
          else
            echo "ERROR: L.A. Crimes process has stopped."

            echo
            echo "===== SERVER LOG ====="

            cat "$GITHUB_WORKSPACE/lac-server.log" || true

            exit 1
          fi

          echo
          echo "===== UDP PORT 7777 ====="

          if ss -lun | grep -q ':7777'; then
            echo "SUCCESS: UDP 7777 is listening."
          else
            echo "WARNING: UDP 7777 is not currently visible."
          fi

      # ==========================================
      # KEEP SERVER ALIVE
      # ==========================================

      - name: Keep server alive
        run: |
          echo "======================================"
          echo "L.A. CRIMES SERVER IS RUNNING"
          echo "======================================"
          echo
          echo "Version: 1.9.6"
          echo "Map: TrainFacility"
          echo "UDP Port: 7777"
          echo "Max Players: 16"
          echo
          echo "======================================"

          while true; do

            if [ ! -f "$GITHUB_WORKSPACE/lac.pid" ]; then
              echo
              echo "ERROR: Server PID file disappeared."
              exit 1
            fi

            PID=$(cat "$GITHUB_WORKSPACE/lac.pid")

            if ! kill -0 "$PID" 2>/dev/null; then
              echo
              echo "ERROR: L.A. Crimes server stopped."

              echo
              echo "===== FINAL SERVER LOG ====="

              cat "$GITHUB_WORKSPACE/lac-server.log" || true

              exit 1
            fi

            echo
            echo "[$(date '+%H:%M:%S')] Server is alive."
            echo "PID: $PID"

            if ss -lun | grep -q ':7777'; then
              echo "UDP 7777: LISTENING"
            else
              echo "UDP 7777: NOT DETECTED"
            fi

            sleep 30

          done
