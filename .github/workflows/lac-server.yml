name: L.A. Crimes Public Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT L.A. CRIMES REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # INSTALL BASIC DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            git \
            openjdk-17-jdk \
            maven

      # ==========================================
      # FIND SERVER CONFIG
      # ==========================================

      - name: Find ServerConfig.txt
        run: |
          set -e

          echo "======================================"
          echo "Searching for ServerConfig.txt"
          echo "======================================"

          CONFIG_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "ServerConfig.txt" \
            -print -quit)

          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: ServerConfig.txt was not found."
            exit 1
          fi

          echo "Found:"
          echo "$CONFIG_FILE"

          cp "$CONFIG_FILE" "$GITHUB_WORKSPACE/ServerConfig.txt"

          echo
          echo "===== CONFIG ====="
          cat "$GITHUB_WORKSPACE/ServerConfig.txt"

      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes server
        run: |
          set -e

          echo "======================================"
          echo "Downloading L.A. Crimes v1.9.6"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O LAC_Linux_v1.9.6.zip \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            LAC_Linux_v1.9.6.zip \
            -d "$GITHUB_WORKSPACE/lac"

          chmod +x \
            "$GITHUB_WORKSPACE/lac/LAC_Linux_v1.9.6.x86_64"

      # ==========================================
      # INSTALL L.A. CRIMES CONFIG
      # ==========================================

      - name: Install L.A. Crimes configuration
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

          echo "======================================"
          echo "L.A. Crimes configuration installed"
          echo "======================================"

          sudo cat "$CONFIG_DIR/ServerConfig.txt"

      # ==========================================
      # VERIFY PORT
      # ==========================================

      - name: Verify L.A. Crimes configuration
        run: |
          set -e

          CONFIG="/root/.config/unity3d/MA/LAC/ServerConfig.txt"

          if ! sudo grep -q '^starting port=7777$' "$CONFIG"; then
            echo "ERROR: Server is not configured for port 7777."
            exit 1
          fi

          echo "SUCCESS: L.A. Crimes configured for UDP 7777."

      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/lac"

          echo "======================================"
          echo "Starting L.A. Crimes"
          echo "======================================"
          echo "Version: 1.9.6"
          echo "UDP: 7777"
          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          PID=$!

          echo "$PID" > "$GITHUB_WORKSPACE/lac.pid"

          sleep 30

          echo
          echo "===== L.A. CRIMES PROCESS ====="

          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

      # ==========================================
      # BUILD PORT BUDDY FROM OFFICIAL SOURCE
      # ==========================================

      - name: Build Port Buddy CLI
        run: |
          set -e

          echo "======================================"
          echo "Building official Port Buddy CLI"
          echo "======================================"

          git clone \
            --depth 1 \
            https://github.com/amak-tech/port-buddy.git \
            "$GITHUB_WORKSPACE/port-buddy"

          cd "$GITHUB_WORKSPACE/port-buddy"

          echo
          echo "Building CLI..."

          ./mvnw \
            -pl cli \
            -am \
            -DskipTests \
            package

          echo
          echo "===== CLI BUILD ====="

          find cli/target \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

      # ==========================================
      # INSTALL PORT BUDDY
      # ==========================================

      - name: Install Port Buddy CLI
        run: |
          set -e

          echo "======================================"
          echo "Installing Port Buddy CLI"
          echo "======================================"

          JAR=$(find \
            "$GITHUB_WORKSPACE/port-buddy/cli/target" \
            -maxdepth 1 \
            -type f \
            -name 'cli-*.jar' \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: Port Buddy CLI JAR was not built."
            exit 1
          fi

          echo "CLI:"
          echo "$JAR"

          cat > "$GITHUB_WORKSPACE/portbuddy" <<EOF
          #!/bin/sh
          exec java -jar "$JAR" "\$@"
          EOF

          chmod +x "$GITHUB_WORKSPACE/portbuddy"

          sudo cp \
            "$GITHUB_WORKSPACE/portbuddy" \
            /usr/local/bin/portbuddy

          echo
          echo "Port Buddy version:"
          portbuddy --version

      # ==========================================
      # AUTHENTICATE PORT BUDDY
      # ==========================================

      - name: Authenticate Port Buddy
        env:
          PORTBUDDY_TOKEN: ${{ secrets.PORTBUDDY_TOKEN }}
        run: |
          set -e

          if [ -z "$PORTBUDDY_TOKEN" ]; then
            echo "ERROR: PORTBUDDY_TOKEN secret is missing."
            echo
            echo "Create a GitHub Actions secret named:"
            echo "PORTBUDDY_TOKEN"
            exit 1
          fi

          mkdir -p "$HOME/.port-buddy"

          printf '%s' "$PORTBUDDY_TOKEN" \
            > "$HOME/.port-buddy/token"

          chmod 600 \
            "$HOME/.port-buddy/token"

          echo "Port Buddy authentication configured."

      # ==========================================
      # START UDP TUNNEL
      # ==========================================

      - name: Start Port Buddy UDP tunnel
        run: |
          set -e

          echo "======================================"
          echo "Starting Port Buddy UDP tunnel"
          echo "======================================"
          echo
          echo "Local server:"
          echo "UDP 7777"
          echo
          echo "======================================"

          portbuddy \
            udp \
            7777 \
            > "$GITHUB_WORKSPACE/portbuddy.log" 2>&1 &

          PID=$!

          echo "$PID" \
            > "$GITHUB_WORKSPACE/portbuddy.pid"

          sleep 15

          echo
          echo "===== PORT BUDDY ====="

          cat "$GITHUB_WORKSPACE/portbuddy.log"

          echo
          echo "======================================"
          echo "PUBLIC SERVER ADDRESS"
          echo "======================================"

          grep -Ei \
            'exposed to:|public:|udp .*portbuddy.dev' \
            "$GITHUB_WORKSPACE/portbuddy.log" \
            || true

          echo "======================================"

      # ==========================================
      # VERIFY BOTH PROCESSES
      # ==========================================

      - name: Verify server and tunnel
        run: |
          set -e

          echo "======================================"
          echo "FINAL SERVER CHECK"
          echo "======================================"

          LAC_PID=$(cat "$GITHUB_WORKSPACE/lac.pid")
          PB_PID=$(cat "$GITHUB_WORKSPACE/portbuddy.pid")

          if kill -0 "$LAC_PID" 2>/dev/null; then
            echo "L.A. Crimes: RUNNING"
          else
            echo "L.A. Crimes: STOPPED"
            exit 1
          fi

          if kill -0 "$PB_PID" 2>/dev/null; then
            echo "Port Buddy: RUNNING"
          else
            echo "Port Buddy: STOPPED"
            cat "$GITHUB_WORKSPACE/portbuddy.log" || true
            exit 1
          fi

          echo
          echo "Local UDP:"
          ss -lunp | grep ':7777' || true

      # ==========================================
      # KEEP EVERYTHING ALIVE
      # ==========================================

      - name: Keep server alive
        run: |
          echo
          echo "======================================"
          echo "L.A. CRIMES PUBLIC SERVER IS RUNNING"
          echo "======================================"
          echo
          echo "Game server: UDP 7777"
          echo "Tunnel: Port Buddy UDP"
          echo
          echo "The PUBLIC address is shown above."
          echo "======================================"

          while true; do

            LAC_PID=$(cat "$GITHUB_WORKSPACE/lac.pid")
            PB_PID=$(cat "$GITHUB_WORKSPACE/portbuddy.pid")

            if ! kill -0 "$LAC_PID" 2>/dev/null; then
              echo "L.A. Crimes stopped."
              echo
              echo "===== L.A. CRIMES LOG ====="
              tail -200 "$GITHUB_WORKSPACE/lac-server.log"
              exit 1
            fi

            if ! kill -0 "$PB_PID" 2>/dev/null; then
              echo "Port Buddy stopped."
              echo
              echo "===== PORT BUDDY LOG ====="
              cat "$GITHUB_WORKSPACE/portbuddy.log"
              exit 1
            fi

            echo
            echo "[$(date '+%H:%M:%S')] L.A. Crimes + Port Buddy running."

            sleep 30

          done
