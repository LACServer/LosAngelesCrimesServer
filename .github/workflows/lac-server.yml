name: L.A. Crimes Linux Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip wget curl

      - name: Download official L.A. Crimes Linux server
        run: |
          set -e

          echo "======================================"
          echo "Downloading L.A. Crimes v1.9.6"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O LAC_Linux_v1.9.6.zip \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          ls -lh LAC_Linux_v1.9.6.zip

      - name: Extract server
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            LAC_Linux_v1.9.6.zip \
            -d "$GITHUB_WORKSPACE/lac"

          chmod +x \
            "$GITHUB_WORKSPACE/lac/LAC_Linux_v1.9.6.x86_64"

          echo "======================================"
          echo "Server files extracted"
          echo "======================================"

          ls -lah "$GITHUB_WORKSPACE/lac"

      - name: Create official L.A. Crimes configuration
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          echo "======================================"
          echo "Creating L.A. Crimes configuration"
          echo "======================================"

          sudo mkdir -p "$CONFIG_DIR"

          sudo tee "$CONFIG_DIR/ServerConfig.txt" > /dev/null <<'EOF'
          #place config in /root/.config/unity3d/MA/LAC/ServerConfig.txt
          #place maps in   /root/.config/unity3d/MA/LAC/editor/myMap.txt

          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          #make map rotation with ","
          #players can get admin by typing "/YOUR-NUM-CODE" in the chat
          #lock down will avoids changes in: server option, editor obj sync

          (Moderator)
          admin code=123456
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=TrainFacility
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          echo
          echo "===== SERVER CONFIG ====="
          sudo cat "$CONFIG_DIR/ServerConfig.txt"

          echo
          echo "===== CONFIG LOCATION ====="
          sudo ls -l "$CONFIG_DIR/ServerConfig.txt"

      - name: Verify server configuration
        run: |
          set -e

          CONFIG="/root/.config/unity3d/MA/LAC/ServerConfig.txt"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: ServerConfig.txt was not created."
            exit 1
          fi

          echo "Configuration found:"
          sudo cat "$CONFIG"

          echo
          echo "Checking port..."

          if sudo grep -q '^starting port=7777$' "$CONFIG"; then
            echo "OK: starting port is 7777"
          else
            echo "ERROR: starting port is not 7777"
            exit 1
          fi

          echo "Configuration verification passed."

      - name: Start L.A. Crimes server
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/lac"

          echo "======================================"
          echo "Starting L.A. Crimes Linux server"
          echo "======================================"
          echo "Version: 1.9.6"
          echo "Map: TrainFacility"
          echo "UDP: 7777"
          echo "Max players: 16"
          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          SERVER_PID=$!

          echo "$SERVER_PID" > "$GITHUB_WORKSPACE/lac.pid"

          echo "Server PID: $SERVER_PID"

          sleep 30

          echo
          echo "===== SERVER PROCESS ====="
          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="
          ss -lunp | grep ':7777' || true

          echo
          echo "===== SERVER LOG ====="
          cat "$GITHUB_WORKSPACE/lac-server.log" || true

      - name: Verify UDP port
        run: |
          echo "======================================"
          echo "Checking UDP 7777"
          echo "======================================"

          if ss -lun | grep -q ':7777'; then
            echo "SUCCESS: L.A. Crimes is listening on UDP 7777."
          else
            echo "WARNING: UDP 7777 is not currently visible."
            echo
            echo "Last server log:"
            tail -100 "$GITHUB_WORKSPACE/lac-server.log" || true
          fi

      - name: Keep server alive
        run: |
          echo "======================================"
          echo "L.A. CRIMES SERVER IS RUNNING"
          echo "======================================"
          echo "UDP Port: 7777"
          echo "Map: TrainFacility"
          echo "Players: 16"
          echo "======================================"

          while true; do

            if [ ! -f "$GITHUB_WORKSPACE/lac.pid" ]; then
              echo "ERROR: Server PID file disappeared."
              exit 1
            fi

            PID=$(cat "$GITHUB_WORKSPACE/lac.pid")

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: L.A. Crimes server stopped."

              echo
              echo "===== FINAL SERVER LOG ====="
              cat "$GITHUB_WORKSPACE/lac-server.log" || true

              exit 1
            fi

            echo
            echo "Server is alive."
            echo "PID: $PID"

            echo
            echo "UDP status:"
            ss -lun | grep ':7777' || echo "UDP 7777 not currently visible."

            sleep 30

          done
