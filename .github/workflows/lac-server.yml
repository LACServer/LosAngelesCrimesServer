name: L.A. Crimes Linux Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Download repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip wget curl

      - name: Find ServerConfig.txt
        run: |
          set -e

          echo "======================================"
          echo "Searching for ServerConfig.txt"
          echo "======================================"

          echo
          echo "Repository files:"
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort

          echo
          echo "Searching..."

          CONFIG_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "ServerConfig.txt" \
            -print -quit)

          if [ -z "$CONFIG_FILE" ]; then
            echo
            echo "ERROR: ServerConfig.txt was not found anywhere in the repository."
            exit 1
          fi

          echo
          echo "FOUND:"
          echo "$CONFIG_FILE"

          echo "$CONFIG_FILE" > "$GITHUB_WORKSPACE/config_path.txt"

          echo
          echo "===== SERVER CONFIG ====="
          cat "$CONFIG_FILE"

      - name: Download L.A. Crimes v1.9.6
        run: |
          set -e

          echo "======================================"
          echo "Downloading L.A. Crimes v1.9.6"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O LAC_Linux_v1.9.6.zip \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          ls -lh LAC_Linux_v1.9.6.zip

      - name: Extract L.A. Crimes
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            LAC_Linux_v1.9.6.zip \
            -d "$GITHUB_WORKSPACE/lac"

          chmod +x \
            "$GITHUB_WORKSPACE/lac/LAC_Linux_v1.9.6.x86_64"

          echo "======================================"
          echo "Server extracted"
          echo "======================================"

          ls -lah "$GITHUB_WORKSPACE/lac"

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_FILE=$(cat "$GITHUB_WORKSPACE/config_path.txt")

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"
          CONFIG_DEST="$CONFIG_DIR/ServerConfig.txt"

          echo "======================================"
          echo "Installing ServerConfig.txt"
          echo "======================================"

          echo "Source:"
          echo "$CONFIG_FILE"

          echo
          echo "Destination:"
          echo "$CONFIG_DEST"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp "$CONFIG_FILE" "$CONFIG_DEST"

          sudo chmod 644 "$CONFIG_DEST"

          echo
          echo "===== INSTALLED CONFIG ====="

          sudo cat "$CONFIG_DEST"

          echo
          echo "Checking file..."

          if sudo test -f "$CONFIG_DEST"; then
            echo "SUCCESS: ServerConfig.txt installed."
          else
            echo "ERROR: ServerConfig.txt installation failed."
            exit 1
          fi

      - name: Verify configuration
        run: |
          set -e

          CONFIG="/root/.config/unity3d/MA/LAC/ServerConfig.txt"

          echo "======================================"
          echo "Verifying L.A. Crimes configuration"
          echo "======================================"

          echo
          echo "Map:"
          sudo grep '^map name=' "$CONFIG" || true

          echo
          echo "Port:"
          sudo grep '^starting port=' "$CONFIG" || true

          echo
          echo "Players:"
          sudo grep '^max players=' "$CONFIG" || true

          echo

          if sudo grep -q '^starting port=7777$' "$CONFIG"; then
            echo "SUCCESS: Server configured for UDP 7777."
          else
            echo "ERROR: starting port=7777 was not found."
            echo
            echo "Actual configuration:"
            sudo cat "$CONFIG"
            exit 1
          fi

      - name: Start L.A. Crimes server
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/lac"

          echo "======================================"
          echo "Starting L.A. Crimes server"
          echo "======================================"
          echo "Version: 1.9.6"
          echo "Map: TrainFacility"
          echo "UDP: 7777"
          echo "Players: 16"
          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          PID=$!

          echo "$PID" > "$GITHUB_WORKSPACE/lac.pid"

          echo
          echo "Server PID: $PID"

          sleep 30

          echo
          echo "===== SERVER PROCESS ====="

          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

          echo
          echo "===== L.A. CRIMES LOG ====="

          cat "$GITHUB_WORKSPACE/lac-server.log" || true

      - name: Check server
        run: |
          set -e

          echo "======================================"
          echo "Checking server"
          echo "======================================"

          PID=$(cat "$GITHUB_WORKSPACE/lac.pid")

          if kill -0 "$PID" 2>/dev/null; then
            echo "SUCCESS: L.A. Crimes is running."
            echo "PID: $PID"
          else
            echo "ERROR: L.A. Crimes stopped."

            echo
            echo "===== SERVER LOG ====="

            cat "$GITHUB_WORKSPACE/lac-server.log" || true

            exit 1
          fi

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

      - name: Keep server alive
        run: |
          echo "======================================"
          echo "L.A. CRIMES SERVER IS RUNNING"
          echo "======================================"
          echo
          echo "Version: 1.9.6"
          echo "Map: TrainFacility"
          echo "UDP Port: 7777"
          echo "Max Players: 16"
          echo
          echo "======================================"

          while true; do

            PID=$(cat "$GITHUB_WORKSPACE/lac.pid")

            if ! kill -0 "$PID" 2>/dev/null; then
              echo
              echo "ERROR: L.A. Crimes server stopped."

              echo
              echo "===== FINAL SERVER LOG ====="

              cat "$GITHUB_WORKSPACE/lac-server.log" || true

              exit 1
            fi

            echo
            echo "[$(date '+%H:%M:%S')] Server alive."
            echo "PID: $PID"

            if ss -lun | grep -q ':7777'; then
              echo "UDP 7777: LISTENING"
            else
              echo "UDP 7777: NOT DETECTED"
            fi

            sleep 30

          done
