name: L.A. Crimes Public Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 25
      # ==========================================

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            git

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version

      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes Linux Server
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING L.A. CRIMES v1.9.6"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC_Linux_v1.9.6.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC_Linux_v1.9.6.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(find "$GITHUB_WORKSPACE/lac" \
            -type f \
            -name "LAC_Linux_v1.9.6.x86_64" \
            -print -quit)

          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes Linux executable was not found."

            echo
            echo "Downloaded files:"
            find "$GITHUB_WORKSPACE/lac" \
              -maxdepth 3 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$SERVER"

          echo "L.A. Crimes server found:"
          echo "$SERVER"

      # ==========================================
      # DOWNLOAD SERVER CONFIG
      # ==========================================

      - name: Download ServerConfig.txt
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING SERVER CONFIG"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "https://www.lacrimesonline.com/builds/ServerConfig.txt"

          echo
          echo "===== ORIGINAL CONFIG ====="

          cat "$GITHUB_WORKSPACE/ServerConfig.txt"

      # ==========================================
      # CONFIGURE PORT 7777
      # ==========================================

      - name: Configure server port
        run: |
          set -e

          CONFIG="$GITHUB_WORKSPACE/ServerConfig.txt"

          if grep -qE '^[[:space:]]*starting port=' "$CONFIG"; then

            sed -i \
              's/^[[:space:]]*starting port=.*/starting port=7777/' \
              "$CONFIG"

          else

            printf '\nstarting port=7777\n' >> "$CONFIG"

          fi

          echo "======================================"
          echo "FINAL SERVER CONFIG"
          echo "======================================"

          cat "$CONFIG"

      # ==========================================
      # INSTALL CONFIG
      # ==========================================

      - name: Install L.A. Crimes configuration
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

          echo "======================================"
          echo "CONFIG INSTALLED"
          echo "======================================"

          sudo cat \
            "$CONFIG_DIR/ServerConfig.txt"

      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes server
        run: |
          set -e

          SERVER=$(find "$GITHUB_WORKSPACE/lac" \
            -type f \
            -name "LAC_Linux_v1.9.6.x86_64" \
            -print -quit)

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo "======================================"
          echo "STARTING L.A. CRIMES"
          echo "======================================"
          echo "UDP PORT: 7777"
          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          PID=$!

          echo "$PID" > "$GITHUB_WORKSPACE/lac.pid"

          echo "Server PID: $PID"

          sleep 30

          echo
          echo "===== SERVER PROCESS ====="

          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

      # ==========================================
      # SHOW SERVER LOG
      # ==========================================

      - name: Show L.A. Crimes log
        run: |
          echo "======================================"
          echo "L.A. CRIMES SERVER LOG"
          echo "======================================"

          tail -250 \
            "$GITHUB_WORKSPACE/lac-server.log" \
            || true

      # ==========================================
      # CLONE PORT BUDDY
      # ==========================================

      - name: Clone Port Buddy
        run: |
          set -e

          echo "======================================"
          echo "CLONING PORT BUDDY"
          echo "======================================"

          git clone \
            --depth 1 \
            https://github.com/amak-tech/port-buddy.git \
            "$GITHUB_WORKSPACE/port-buddy"

          cd "$GITHUB_WORKSPACE/port-buddy"

          chmod +x mvnw

          echo
          echo "===== PORT BUDDY MODULES ====="

          find . \
            -maxdepth 2 \
            -name "pom.xml" \
            -print

      # ==========================================
      # BUILD ONLY PORT BUDDY CLI
      # ==========================================
      #
      # IMPORTANT:
      # Do NOT run "mvn package" for the whole project.
      # That also builds port-buddy-web, whose Vite build
      # was causing the "URI malformed" error.
      #
      # -pl port-buddy-cli = build the CLI
      # -am               = also build required modules
      #
      # ==========================================

      - name: Build Port Buddy CLI
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/port-buddy"

          echo "======================================"
          echo "BUILDING PORT BUDDY CLI"
          echo "======================================"

          echo
          echo "===== JAVA ====="

          java -version

          echo
          echo "===== MAVEN ====="

          ./mvnw -version

          echo
          echo "===== CLI BUILD ====="

          ./mvnw \
            -pl port-buddy-cli \
            -am \
            -DskipTests \
            package

          echo
          echo "======================================"
          echo "PORT BUDDY CLI BUILD COMPLETE"
          echo "======================================"

      # ==========================================
      # FIND CLI JAR
      # ==========================================

      - name: Find Port Buddy CLI
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/port-buddy"

          echo "======================================"
          echo "FINDING PORT BUDDY CLI JAR"
          echo "======================================"

          JAR=$(find port-buddy-cli/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            -print -quit)

          if [ -z "$JAR" ]; then

            echo "ERROR: Port Buddy CLI JAR was not produced."

            echo
            echo "CLI target contents:"

            find port-buddy-cli/target \
              -maxdepth 2 \
              -type f \
              -print || true

            exit 1
          fi

          echo "Found CLI JAR:"
          echo "$JAR"

          cp "$JAR" \
            "$GITHUB_WORKSPACE/portbuddy.jar"

      # ==========================================
      # INSTALL PORT BUDDY
      # ==========================================

      - name: Install Port Buddy
        run: |
          set -e

          printf '%s\n' \
            '#!/bin/sh' \
            'exec java -jar "$GITHUB_WORKSPACE/portbuddy.jar" "$@"' \
            > "$GITHUB_WORKSPACE/portbuddy"

          chmod +x \
            "$GITHUB_WORKSPACE/portbuddy"

          sudo cp \
            "$GITHUB_WORKSPACE/portbuddy" \
            /usr/local/bin/portbuddy

          echo "======================================"
          echo "PORT BUDDY INSTALLED"
          echo "======================================"

          portbuddy --help || true

      # ==========================================
      # AUTHENTICATE PORT BUDDY
      # ==========================================

      - name: Authenticate Port Buddy
        env:
          PORTBUDDY_TOKEN: ${{ secrets.PORTBUDDY_TOKEN }}
        run: |
          set -e

          if [ -z "$PORTBUDDY_TOKEN" ]; then

            echo "ERROR: PORTBUDDY_TOKEN is missing."

            echo
            echo "Create this GitHub Actions secret:"
            echo
            echo "PORTBUDDY_TOKEN"
            echo
            echo "Repository Settings"
            echo "-> Secrets and variables"
            echo "-> Actions"
            echo "-> New repository secret"

            exit 1
          fi

          echo "======================================"
          echo "AUTHENTICATING PORT BUDDY"
          echo "======================================"

          portbuddy init "$PORTBUDDY_TOKEN"

          echo
          echo "Port Buddy authentication complete."

      # ==========================================
      # START UDP TUNNEL
      # ==========================================

      - name: Start Port Buddy UDP tunnel
        run: |
          set -e

          echo "======================================"
          echo "STARTING PORT BUDDY UDP TUNNEL"
          echo "======================================"

          echo
          echo "LOCAL SERVER:"
          echo "UDP 7777"

          echo

          portbuddy \
            udp \
            7777 \
            > "$GITHUB_WORKSPACE/portbuddy.log" 2>&1 &

          PID=$!

          echo "$PID" \
            > "$GITHUB_WORKSPACE/portbuddy.pid"

          sleep 15

          echo
          echo "======================================"
          echo "PORT BUDDY OUTPUT"
          echo "======================================"

          cat \
            "$GITHUB_WORKSPACE/portbuddy.log"

      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final server check
        run: |
          set -e

          echo "======================================"
          echo "FINAL SERVER CHECK"
          echo "======================================"

          LAC_PID=$(cat \
            "$GITHUB_WORKSPACE/lac.pid")

          PB_PID=$(cat \
            "$GITHUB_WORKSPACE/portbuddy.pid")

          echo "L.A. Crimes PID: $LAC_PID"
          echo "Port Buddy PID: $PB_PID"

          echo

          if kill -0 "$LAC_PID" 2>/dev/null; then
            echo "L.A. Crimes: RUNNING"
          else
            echo "L.A. Crimes: STOPPED"

            echo
            echo "===== SERVER LOG ====="

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1
          fi

          if kill -0 "$PB_PID" 2>/dev/null; then
            echo "Port Buddy: RUNNING"
          else
            echo "Port Buddy: STOPPED"

            echo
            echo "===== PORT BUDDY LOG ====="

            cat \
              "$GITHUB_WORKSPACE/portbuddy.log" \
              || true

            exit 1
          fi

          echo
          echo "===== LOCAL UDP 7777 ====="

          ss -lunp | grep ':7777' || true

          echo
          echo "===== PUBLIC ENDPOINT ====="

          cat \
            "$GITHUB_WORKSPACE/portbuddy.log"

      # ==========================================
      # KEEP SERVER ALIVE
      # ==========================================

      - name: Keep server alive
        run: |
          echo "======================================"
          echo "L.A. CRIMES SERVER IS RUNNING"
          echo "======================================"

          echo
          echo "Local UDP: 7777"
          echo
          echo "The PUBLIC HOST and PORT are"
          echo "shown in the Port Buddy output above."
          echo
          echo "======================================"

          while true; do

            LAC_PID=$(cat \
              "$GITHUB_WORKSPACE/lac.pid")

            PB_PID=$(cat \
              "$GITHUB_WORKSPACE/portbuddy.pid")

            if ! kill -0 "$LAC_PID" 2>/dev/null; then

              echo "L.A. Crimes stopped."

              echo
              echo "===== SERVER LOG ====="

              tail -250 \
                "$GITHUB_WORKSPACE/lac-server.log" \
                || true

              exit 1

            fi

            if ! kill -0 "$PB_PID" 2>/dev/null; then

              echo "Port Buddy stopped."

              echo
              echo "===== PORT BUDDY LOG ====="

              cat \
                "$GITHUB_WORKSPACE/portbuddy.log" \
                || true

              exit 1

            fi

            echo
            echo "[$(date '+%H:%M:%S')] L.A. Crimes + Port Buddy running."

            sleep 30

          done
