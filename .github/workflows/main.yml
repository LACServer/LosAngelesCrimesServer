name: L.A. Crimes Public Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            git

      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING L.A. CRIMES"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(find "$GITHUB_WORKSPACE/lac" \
            -type f \
            -name "LAC_Linux_v1.9.6.x86_64" \
            -print -quit)

          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes executable not found."

            find "$GITHUB_WORKSPACE/lac" \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$SERVER"

          echo "L.A. Crimes found:"
          echo "$SERVER"

      # ==========================================
      # SERVER CONFIG
      # ==========================================

      - name: Create ServerConfig.txt
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<'EOF'
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          #make map rotation with ","
          #players can get admin by typing "/YOUR-NUM-CODE" in the chat
          #lock down will avoids changes in: server option, editor obj sync

          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=TrainFacility
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          echo "======================================"
          echo "SERVER CONFIG"
          echo "======================================"

          cat "$GITHUB_WORKSPACE/ServerConfig.txt"

      # ==========================================
      # INSTALL CONFIG
      # ==========================================

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

          echo "======================================"
          echo "CONFIG INSTALLED"
          echo "======================================"

          sudo cat \
            "$CONFIG_DIR/ServerConfig.txt"

      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes
        run: |
          set -e

          SERVER=$(find "$GITHUB_WORKSPACE/lac" \
            -type f \
            -name "LAC_Linux_v1.9.6.x86_64" \
            -print -quit)

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo "======================================"
          echo "STARTING L.A. CRIMES"
          echo "======================================"

          echo "UDP PORT: 7777"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/lac.pid"

          sleep 30

          echo
          echo "===== PROCESS ====="

          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

      # ==========================================
      # SHOW LAC LOG
      # ==========================================

      - name: Show L.A. Crimes log
        run: |
          echo "======================================"
          echo "L.A. CRIMES LOG"
          echo "======================================"

          tail -250 \
            "$GITHUB_WORKSPACE/lac-server.log" \
            || true

      # ==========================================
      # CLONE PORT BUDDY
      # ==========================================

      - name: Clone Port Buddy
        run: |
          set -e

          echo "======================================"
          echo "CLONING PORT BUDDY"
          echo "======================================"

          git clone \
            --depth 1 \
            https://github.com/amak-tech/port-buddy.git \
            "$GITHUB_WORKSPACE/port-buddy"

          cd "$GITHUB_WORKSPACE/port-buddy"

          chmod +x mvnw

          echo
          echo "===== MODULES ====="

          find . \
            -name pom.xml \
            -print

      # ==========================================
      # BUILD PORT BUDDY
      # ==========================================

      - name: Build and install Port Buddy CLI
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/port-buddy"

          echo "======================================"
          echo "BUILDING PORT BUDDY"
          echo "======================================"

          ./mvnw \
            -pl cli \
            -am \
            -DskipTests \
            clean install

          echo
          echo "======================================"
          echo "PORT BUDDY BUILD SUCCESSFUL"
          echo "======================================"

      # ==========================================
      # PREPARE RUNTIME
      # ==========================================

      - name: Prepare Port Buddy runtime
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/port-buddy"

          echo "======================================"
          echo "PREPARING PORT BUDDY RUNTIME"
          echo "======================================"

          mkdir -p \
            "$GITHUB_WORKSPACE/portbuddy-runtime"

          if [ ! -d "cli/target/classes" ]; then
            echo "ERROR: cli/target/classes not found."
            exit 1
          fi

          cp -r \
            cli/target/classes \
            "$GITHUB_WORKSPACE/portbuddy-runtime/cli-classes"

          if [ ! -d "common/target/classes" ]; then
            echo "ERROR: common/target/classes not found."
            exit 1
          fi

          cp -r \
            common/target/classes \
            "$GITHUB_WORKSPACE/portbuddy-runtime/common-classes"

          ./mvnw \
            -pl cli \
            dependency:build-classpath \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/portbuddy-classpath.txt" \
            -DincludeScope=runtime

          echo
          echo "===== RUNTIME CLASSPATH ====="

          cat \
            "$GITHUB_WORKSPACE/portbuddy-classpath.txt"

      # ==========================================
      # CREATE LAUNCHER
      # ==========================================

      - name: Create Port Buddy launcher
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/portbuddy" <<'EOF'
          #!/bin/bash

          set -e

          ROOT="$GITHUB_WORKSPACE"

          CP="$ROOT/portbuddy-runtime/cli-classes"
          CP="$CP:$ROOT/portbuddy-runtime/common-classes"

          if [ -f "$ROOT/portbuddy-classpath.txt" ]; then
            CP="$CP:$(cat "$ROOT/portbuddy-classpath.txt")"
          fi

          exec java \
            -cp "$CP" \
            tech.amak.portbuddy.cli.PortBuddy \
            "$@"
          EOF

          chmod +x \
            "$GITHUB_WORKSPACE/portbuddy"

          sudo cp \
            "$GITHUB_WORKSPACE/portbuddy" \
            /usr/local/bin/portbuddy

          echo "======================================"
          echo "PORT BUDDY LAUNCHER READY"
          echo "======================================"

      # ==========================================
      # TEST PORT BUDDY
      # ==========================================

      - name: Test Port Buddy
        run: |
          set -e

          echo "======================================"
          echo "TESTING PORT BUDDY"
          echo "======================================"

          portbuddy --help

      # ==========================================
      # AUTHENTICATE
      # ==========================================

      - name: Authenticate Port Buddy
        env:
          PORTBUDDY_TOKEN: ${{ secrets.PORTBUDDY_TOKEN }}
        run: |
          set -e

          if [ -z "$PORTBUDDY_TOKEN" ]; then
            echo "ERROR: PORTBUDDY_TOKEN is missing."
            exit 1
          fi

          echo "======================================"
          echo "AUTHENTICATING PORT BUDDY"
          echo "======================================"

          portbuddy init "$PORTBUDDY_TOKEN"

          echo
          echo "Port Buddy authentication complete."

      # ==========================================
      # START UDP TUNNEL
      # ==========================================

      - name: Start Port Buddy UDP tunnel
        run: |
          set -e

          echo "======================================"
          echo "STARTING PORT BUDDY"
          echo "======================================"

          echo "LOCAL UDP: 7777"

          portbuddy \
            udp \
            7777 \
            > "$GITHUB_WORKSPACE/portbuddy.log" 2>&1 &

          echo $! \
            > "$GITHUB_WORKSPACE/portbuddy.pid"

          sleep 15

          echo
          echo "======================================"
          echo "PORT BUDDY OUTPUT"
          echo "======================================"

          cat \
            "$GITHUB_WORKSPACE/portbuddy.log"

      # ==========================================
      # CREATE LIVE LOG
      # ==========================================

      - name: Create initial live log
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          {
            echo "======================================"
            echo "L.A. CRIMES PUBLIC SERVER"
            echo "======================================"
            echo
            echo "STATUS: STARTING"
            echo
            echo "LOCAL UDP: 7777"
            echo
            echo "======================================"
            echo "PORT BUDDY"
            echo "======================================"
            echo
            cat portbuddy.log 2>/dev/null || true
            echo
            echo "======================================"
            echo "L.A. CRIMES LOG"
            echo "======================================"
            echo
            tail -300 lac-server.log 2>/dev/null || true
          } > live-server-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-server-log.txt

          git commit \
            -m "Initialize live server log" \
            || true

          git push \
            origin \
            HEAD:main \
            || true

      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final server check
        run: |
          set -e

          echo "======================================"
          echo "FINAL SERVER CHECK"
          echo "======================================"

          LAC_PID=$(cat "$GITHUB_WORKSPACE/lac.pid")
          PB_PID=$(cat "$GITHUB_WORKSPACE/portbuddy.pid")

          echo "L.A. Crimes PID: $LAC_PID"
          echo "Port Buddy PID: $PB_PID"

          echo

          if ! kill -0 "$LAC_PID" 2>/dev/null; then
            echo "L.A. Crimes stopped."

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1
          fi

          if ! kill -0 "$PB_PID" 2>/dev/null; then
            echo "Port Buddy stopped."

            cat \
              "$GITHUB_WORKSPACE/portbuddy.log" \
              || true

            exit 1
          fi

          echo "L.A. Crimes: RUNNING"
          echo "Port Buddy: RUNNING"

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

          echo
          echo "===== PUBLIC ENDPOINT ====="

          cat "$GITHUB_WORKSPACE/portbuddy.log"

      # ==========================================
      # KEEP SERVER ALIVE
      # ==========================================

      - name: Keep server alive
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "======================================"
          echo "L.A. CRIMES SERVER IS RUNNING"
          echo "======================================"

          echo
          echo "LOCAL UDP: 7777"
          echo
          echo "PUBLIC ADDRESS:"
          echo "See Port Buddy output above."
          echo
          echo "======================================"

          while true; do

            LAC_PID=$(cat "$GITHUB_WORKSPACE/lac.pid")
            PB_PID=$(cat "$GITHUB_WORKSPACE/portbuddy.pid")

            # --------------------------------------
            # CHECK SERVER
            # --------------------------------------

            if ! kill -0 "$LAC_PID" 2>/dev/null; then
              echo "L.A. Crimes stopped."
              exit 1
            fi

            # --------------------------------------
            # CHECK PORT BUDDY
            # --------------------------------------

            if ! kill -0 "$PB_PID" 2>/dev/null; then
              echo "Port Buddy stopped."

              echo
              echo "===== PORT BUDDY LOG ====="

              cat "$GITHUB_WORKSPACE/portbuddy.log" || true

              exit 1
            fi

            # --------------------------------------
            # UPDATE LIVE LOG
            # --------------------------------------

            {
              echo "======================================"
              echo "L.A. CRIMES PUBLIC SERVER"
              echo "======================================"
              echo
              echo "STATUS: RUNNING"
              echo "TIME: $(date '+%Y-%m-%d %H:%M:%S UTC')"
              echo
              echo "LOCAL UDP: 7777"
              echo
              echo "======================================"
              echo "PORT BUDDY"
              echo "======================================"
              echo
              cat "$GITHUB_WORKSPACE/portbuddy.log" 2>/dev/null || true
              echo
              echo "======================================"
              echo "L.A. CRIMES LOG"
              echo "======================================"
              echo
              tail -300 "$GITHUB_WORKSPACE/lac-server.log" 2>/dev/null || true
              echo
              echo "======================================"
              echo "SERVER CHECK"
              echo "======================================"
              echo
              echo "L.A. Crimes PID: $LAC_PID"
              echo "Port Buddy PID: $PB_PID"
              echo
              echo "UDP 7777:"
              ss -lunp | grep ':7777' || true
              echo
              echo "Last update: $(date '+%H:%M:%S UTC')"
            } > "$GITHUB_WORKSPACE/live-server-log.txt"

            # --------------------------------------
            # PUSH LOG TO GITHUB
            # --------------------------------------

            git add live-server-log.txt

            if ! git diff --cached --quiet; then

              git commit \
                -m "Update live server log" \
                || true

              git push \
                origin \
                HEAD:main \
                || true

            fi

            echo
            echo "[$(date '+%H:%M:%S')]"
            echo "L.A. Crimes + Port Buddy running."
            echo "Live log updated."

            sleep 10

          done
